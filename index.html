<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f3eee4">
<title>Word Island · Unit 1 At school</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14213d;
    --paper: #f3eee4;
    --card: #fffdf8;
    --navy: #14213d;
    --gold: #ffe14a;
    --gold-deep: #c9a414;
    --leaf: #157a3a;
    --leaf-soft: #d9f3e4;
    --sky: #2f6fed;
    --coral: #9c2f24;
    --coral-soft: #ffd9d4;
    --line: #e4d8c4;
    --focus: #14213d;
    --shadow: 0 10px 0 rgba(20, 33, 61, .06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: Lexend, "Trebuchet MS", sans-serif;
    color: var(--ink);
    background-color: var(--paper);
    background-image:
      radial-gradient(circle at 8% 12%, #d9f3e4 0, transparent 32%),
      radial-gradient(circle at 96% 0%, #ffe9a8 0, transparent 26%),
      radial-gradient(circle at 80% 100%, #d5e6ff 0, transparent 28%);
  }
  body[data-screen="maze"] { background-color: #e7f6ef; }
  body[data-screen="moles"] { background-color: #e5f4ee; }
  body[data-screen="hangman"] { background-color: #f8f1e4; }
  body[data-screen="planes"] { background-color: #d7eefe; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, a:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 3px;
  }
  .skip {
    position: absolute;
    left: 12px;
    top: -40px;
    background: #fff;
    padding: 8px 12px;
    z-index: 5;
  }
  .skip:focus { top: 12px; }
  .app { min-height: 100dvh; display: flex; flex-direction: column; }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 18px 6px;
    width: min(1040px, 100%);
    margin: 0 auto;
  }
  .brand { margin: 0; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--gold);
    box-shadow: inset 0 -2px 0 var(--gold-deep);
  }
  .tools { display: flex; align-items: center; gap: 8px; }
  #stars { margin: 0; font-weight: 700; min-width: 3ch; }
  .ghost, .btn, .choice, .mole, .basket, .gate, .next {
    border: 3px solid var(--ink);
    border-radius: 14px;
    background: #fff;
    box-shadow: 0 4px 0 rgba(20, 33, 61, .18);
  }
  .ghost { padding: 6px 12px; font-weight: 700; background: transparent; }
  .ghost[aria-pressed="true"] { background: var(--gold); }
  main { flex: 0 0 auto; width: min(1040px, 100%); margin: 0 auto; padding: 8px 18px 12px; }
  #caption { margin-top: auto; }
  .hero { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; margin-bottom: 18px; }
  .pill {
    display: inline-block;
    margin: 0 0 8px;
    background: var(--gold);
    border-radius: 999px;
    padding: 4px 12px;
    font-weight: 700;
    font-size: .92rem;
  }
  h1 {
    font-family: Fraunces, Palatino, Georgia, serif;
    font-size: clamp(2.4rem, 6vw, 4.4rem);
    line-height: .95;
    font-weight: 600;
    margin: 0 0 8px;
    letter-spacing: -0.03em;
  }
  .lede { margin: 0; font-size: 1.15rem; max-width: 36ch; }
  .ladder { margin: 10px 0 0; font-weight: 700; color: var(--leaf); }
  .robo { width: 120px; height: 120px; }
  .gates { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .gate {
    text-align: left;
    padding: 14px;
    background: var(--card);
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 230px;
  }
  .gate:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(20, 33, 61, .18); }
  .gate[aria-disabled="true"] { opacity: .72; }
  .num { font-weight: 700; color: var(--sky); }
  .gt { font-family: Fraunces, Palatino, Georgia, serif; font-size: 1.7rem; font-weight: 600; }
  .gl, .gs { display: block; }
  .gs { margin-top: auto; font-weight: 700; }
  .scene { height: 64px; border-radius: 12px; border: 2px solid var(--ink); }
  .scene-maze {
    background:
      radial-gradient(circle at 72% 42%, #ffe14a 0 9px, transparent 10px),
      linear-gradient(#b7e4c7, #7dcea0);
  }
  .scene-moles {
    background:
      radial-gradient(circle at 20% 70%, #6b3f2a 0 10px, transparent 11px),
      radial-gradient(circle at 50% 62%, #f3d2b5 0 12px, transparent 13px),
      radial-gradient(circle at 78% 70%, #6b3f2a 0 10px, transparent 11px),
      linear-gradient(#c8f0d4, #8fd4b0);
  }
  .scene-hangman {
    background:
      linear-gradient(#14213d, #14213d) 18% 80% / 50% 3px no-repeat,
      linear-gradient(#14213d, #14213d) 20% 28% / 3px 55% no-repeat,
      linear-gradient(#14213d, #14213d) 20% 28% / 42% 3px no-repeat,
      radial-gradient(circle at 62% 48%, #14213d 0 5px, transparent 6px),
      linear-gradient(#fff6ea, #f3d7b0);
  }
  .scene-planes {
    background:
      linear-gradient(#ffe14a, #ffe14a) 50% 62% / 18px 8px no-repeat,
      linear-gradient(#14213d, #14213d) 42% 70% / 10px 16px no-repeat,
      linear-gradient(#14213d, #14213d) 58% 70% / 10px 16px no-repeat,
      radial-gradient(circle at 22% 28%, #fff 0 7px, transparent 8px),
      linear-gradient(#7ec8f8, #d4efff);
  }
  .partner { margin: 14px 0 0; }
  .linkish { background: none; border: 0; box-shadow: none; padding: 0; font-weight: 700; text-decoration: underline; }
  .playwrap { width: min(760px, 100%); margin: 0 auto; }
  .playbar { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .playbar .back { padding: 6px 12px; font-weight: 700; }
  .gatename { margin: 0; font-weight: 700; flex: 1; }
  .count { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pips { display: flex; gap: 5px; margin: 0 0 12px; }
  .pips i {
    flex: 1; height: 8px; border-radius: 99px; background: #fff; border: 2px solid var(--ink);
    display: block;
  }
  .pips i.did { background: var(--leaf); }
  .pips i.now { background: var(--gold); }
  .stage {
    background: var(--card);
    border: 3px solid var(--ink);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 16px;
  }
  .stage.challenge { box-shadow: inset 0 0 0 4px var(--gold), var(--shadow); }
  .qrow { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  #qtitle {
    font-family: Fraunces, Palatino, Georgia, serif;
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    line-height: 1.15;
    margin: 0;
    font-weight: 600;
  }
  #qtitle:focus { outline: none; }
  .chip {
    display: inline-block;
    margin-bottom: 6px;
    background: var(--gold);
    border-radius: 999px;
    padding: 2px 8px;
    font-family: Lexend, sans-serif;
    font-size: .85rem;
    font-weight: 700;
    vertical-align: middle;
  }
  .door {
    width: min(280px, 86%);
    margin: 8px auto 12px;
    background: linear-gradient(#fff6d8, #ffe9a8);
    border: 3px solid var(--ink);
    border-radius: 18px 18px 8px 8px;
    padding: 28px 10px 16px;
    position: relative;
  }
  .door .star {
    position: absolute;
    top: -14px; left: 50%;
    transform: translateX(-50%);
    background: var(--gold);
    border: 3px solid var(--ink);
    border-radius: 50%;
    width: 36px; height: 36px;
    display: grid; place-items: center;
    font-weight: 700;
  }
  .pic { display: grid; place-items: center; min-height: 150px; }
  .pic.small { min-height: 96px; }
  .ico { width: 128px; height: 128px; }
  .pic.small .ico { width: 88px; height: 88px; }
  .choices { display: grid; gap: 10px; margin-top: 12px; }
  .choice, .mole, .basket, .next, .btn {
    font-weight: 700;
    padding: 12px 14px;
  }
  .choice:active, .basket:active, .next:active, .btn:active, .ghost:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 rgba(20, 33, 61, .18);
  }
  .choice.right, .mole.right, .basket.right { background: var(--leaf-soft); border-color: var(--leaf); }
  .choice.wrong, .mole.wrong, .basket.wrong { background: var(--coral-soft); }
  .choice.show-right, .mole.show-right, .basket.show-right { background: var(--leaf-soft); }
  .field {
    margin-top: 12px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    background: #c8efd6;
    border-radius: 18px;
    padding: 12px;
    border: 3px solid #1f6b3a;
  }
  .pit { position: relative; height: 132px; overflow: hidden; }
  .hole {
    position: absolute;
    left: 8px; right: 8px; bottom: 8px;
    height: 28px; border-radius: 50%;
    background: #5a3a28;
    border: 3px solid #3a2418;
    z-index: 2;
    pointer-events: none;
  }
  .mole {
    position: absolute;
    left: 6px; right: 6px; bottom: 18px;
    z-index: 1;
    min-height: 74px;
    border-radius: 18px 18px 12px 12px;
    background: #f6d7c3;
    transform: translateY(140%);
    transition: transform .22s ease;
    pointer-events: none;
  }
  .mole.up { transform: translateY(0); pointer-events: auto; }
  .mole.up:active { transform: translateY(5px); }
  .prompt-line { margin: 8px 0; font-weight: 700; text-align: center; }
  .card {
    margin: 10px auto;
    max-width: 460px;
    background: #fff;
    border: 3px dashed var(--ink);
    border-radius: 16px;
    padding: 16px;
    text-align: center;
    font-family: Fraunces, Palatino, Georgia, serif;
    font-size: clamp(1.4rem, 3vw, 2rem);
    font-weight: 600;
    touch-action: none;
    user-select: none;
    cursor: grab;
  }
  .card.dragging { cursor: grabbing; z-index: 3; position: relative; background: #fff6ea; }
  .draghint { text-align: center; margin: 0 0 8px; font-size: .95rem; }
  .hangrow { display: grid; grid-template-columns: 1fr 150px; gap: 8px; align-items: center; }
  .gallows { width: 150px; height: 176px; display: block; margin: 0 auto; }
  .part { opacity: 0; }
  .part.on { opacity: 1; }
  .blanks { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 12px 0; }
  .blank {
    width: 42px; height: 50px;
    border-bottom: 4px solid var(--ink);
    display: grid; place-items: center;
    font-family: Fraunces, Palatino, Georgia, serif;
    font-size: 2rem; font-weight: 600;
  }
  .blank.show { color: var(--coral); }
  .tries { text-align: center; margin: 0 0 8px; font-weight: 700; }
  .sky {
    position: relative;
    height: min(460px, 62dvh);
    min-height: 320px;
    margin-top: 8px;
    overflow: hidden;
    border-radius: 16px;
    border: 3px solid var(--ink);
    background: linear-gradient(#67b7ee, #e7f6ff 72%, #8fd4b0);
    touch-action: none;
    user-select: none;
  }
  .cloud {
    position: absolute;
    height: 22px;
    border-radius: 20px;
    background: #fff;
    opacity: .85;
    animation: drift 8s linear infinite;
    pointer-events: none;
  }
  .cloud.c1 { width: 74px; left: 12%; top: -30px; animation-duration: 9s; }
  .cloud.c2 { width: 52px; left: 62%; top: -80px; animation-duration: 7.5s; animation-delay: -3s; }
  .cloud.c3 { width: 90px; left: 38%; top: -140px; animation-duration: 11s; animation-delay: -6s; }
  @keyframes drift {
    from { transform: translateY(0); }
    to { transform: translateY(560px); }
  }
  .bandit {
    position: absolute;
    top: 12px;
    width: 30%;
    transform: translateX(-50%);
    border: 0;
    background: transparent;
    box-shadow: none;
    padding: 0;
    pointer-events: none;
    z-index: 1;
  }
  .bandit[data-lane="0"] { left: 17%; }
  .bandit[data-lane="1"] { left: 50%; }
  .bandit[data-lane="2"] { left: 83%; }
  .bandit span {
    display: block;
    background: #fffdf8;
    border: 3px solid var(--ink);
    border-radius: 10px;
    padding: 4px 4px 3px;
    font-weight: 700;
    font-size: clamp(.78rem, 2.5vw, 1rem);
    line-height: 1.15;
    text-align: center;
  }
  .miniplane { width: 54px; height: 42px; display: block; margin: 2px auto 0; }
  .bandit.right span, .bandit.show-right span { background: var(--leaf-soft); }
  .bandit.wrong span { background: var(--coral-soft); }
  .ship {
    position: absolute;
    left: 50%;
    top: 78%;
    width: 58px;
    height: 68px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 3;
    filter: drop-shadow(0 6px 0 rgba(20, 33, 61, .18));
  }
  .bolt {
    position: absolute;
    width: 6px;
    height: 16px;
    margin-left: -3px;
    border-radius: 4px;
    background: var(--gold);
    border: 2px solid var(--ink);
    pointer-events: none;
    z-index: 2;
  }
  .sky.still .ship, .sky.still .cloud, .sky.still #bolts { display: none; }
  .sky.still .bandit { pointer-events: auto; cursor: pointer; }
  .abc { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .key {
    min-height: 42px;
    font-weight: 700;
    font-size: 1.05rem;
    border: 3px solid var(--ink);
    border-radius: 10px;
    background: #fff;
    box-shadow: 0 3px 0 rgba(20, 33, 61, .18);
  }
  .key:disabled { box-shadow: none; }
  .key.right:disabled { background: var(--leaf-soft); }
  .key.wrong:disabled { background: var(--coral-soft); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .btn.gold { background: var(--gold); }
  .btn.leaf { background: var(--leaf-soft); }
  .results h2 {
    font-family: Fraunces, Palatino, Georgia, serif;
    font-size: clamp(2rem, 5vw, 3.2rem);
    margin: 0 0 8px;
    font-weight: 600;
  }
  .tips { list-style: none; padding: 0; margin: 12px 0; display: grid; gap: 8px; }
  .tips li { background: #fff8e4; border-radius: 12px; padding: 10px 12px; }
  .tips p { margin: 0; }
  #feedback {
    min-height: 2.8em;
    margin: 0 auto;
    width: min(1040px, 100%);
    padding: 4px 18px 8px;
    text-align: center;
    font-weight: 700;
  }
  #feedback:empty { min-height: 0; padding: 0; }
  #feedback.ok { color: var(--leaf); }
  #feedback.tip { color: var(--ink); }
  h2:focus { outline: none; }
  #caption {
    margin: 0;
    background: var(--navy);
    color: #f4efe4;
    text-align: center;
    padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
    font-weight: 600;
    line-height: 1.35;
  }
  .ask {
    position: fixed; inset: 0;
    background: rgba(20, 33, 61, .45);
    display: grid; place-items: center;
    z-index: 10;
    padding: 18px;
  }
  .ask[hidden] { display: none; }
  .askbox {
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 18px;
    padding: 18px;
    width: min(420px, 100%);
    box-shadow: var(--shadow);
  }
  .askbox p { margin: 0 0 12px; font-weight: 700; }
  .askbox div { display: flex; gap: 8px; justify-content: flex-end; }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15; }
  .shake { animation: shake .4s linear; }
  .mole.shake { animation: mole-shake .4s linear; }
  @keyframes mole-shake {
    25% { margin-left: -6px; }
    75% { margin-left: 6px; }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  @media (max-width: 800px) {
    .hero { grid-template-columns: 1fr; }
    .robo { display: none; }
    .gates { grid-template-columns: 1fr; }
    .gate { min-height: 0; }
    .field { grid-template-columns: repeat(2, 1fr); }
    .hangrow { grid-template-columns: 1fr; }
    .abc { grid-template-columns: repeat(6, 1fr); }
  }
  @media (min-width: 700px) {
    .choices { grid-template-columns: repeat(3, 1fr); }
  }
  @media (hover: hover) {
    .choice:hover, .basket:hover, .gate:hover, .btn:hover {
      transform: translateY(-2px);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body data-screen="hub">
<a class="skip" href="#view">Skip to the game</a>
<canvas id="confetti" aria-hidden="true"></canvas>
<div class="app">
  <header class="top">
    <p class="brand"><span class="dot" aria-hidden="true"></span> Word Island</p>
    <div class="tools">
      <p id="stars" aria-live="polite">★ 0</p>
      <button type="button" class="ghost" id="soundBtn" data-act="sound" aria-pressed="true">Sound on</button>
    </div>
  </header>
  <main>
    <div id="view"></div>
    <p id="feedback" role="status" aria-live="polite"></p>
  </main>
  <p id="caption"></p>
</div>
<div id="ask" class="ask" hidden>
  <div class="askbox" role="dialog" aria-modal="true" aria-labelledby="asktext">
    <p id="asktext"></p>
    <div>
      <button type="button" class="btn" id="askno" data-act="ask-no">Stay</button>
      <button type="button" class="btn gold" id="askyes" data-act="ask-yes">Leave</button>
    </div>
  </div>
</div>
<noscript><p>This page needs JavaScript. Turn it on, then open Word Island again.</p></noscript>
<script>
const CAPTION = {
  hub: "Pen or pencil? Come to Word Island. Play, and practise.",
  maze: "Game 1. Walk the maze. At the star door, choose the word.",
  moles: "Game 2. Read the question. Hit the mole when the right answer pops up.",
  hangman: "Game 3. Look at the picture. Guess the letters.",
  planes: "Game 4. Move the plane. Hold to shoot the right word.",
  results: "A wrong answer is fine. Read the tip. Try that one again. Collect your badge."
};

const GATES = [
  { id: "maze", n: "01", title: "Word maze", line: "See the picture. Choose the word.", need: "This game is open." },
  { id: "moles", n: "02", title: "Answer moles", line: "Answers pop up. Hit the right one.", need: "Finish the maze first." },
  { id: "hangman", n: "03", title: "Hangman", line: "Guess the letters. Spell the word.", need: "Finish the moles first." },
  { id: "planes", n: "04", title: "Sky planes", line: "Fly the plane. Shoot the right word.", need: "Finish hangman first." }
];

const GAME = {
  maze: "Game 1 · Word maze",
  moles: "Game 2 · Answer moles",
  hangman: "Game 3 · Hangman",
  planes: "Game 4 · Sky planes"
};

const BADGE = { maze: "Maze badge", moles: "Mole badge", hangman: "Hangman badge", planes: "Plane badge" };

const MAZE = [
  { id: "m1", icon: "pen", choices: ["a pencil", "a pen", "a ruler"], answer: 1, tip: "It's a pen." },
  { id: "m2", icon: "ruler", choices: ["a rubber", "a ruler", "a book"], answer: 1, tip: "It's a ruler." },
  { id: "m3", icon: "book", choices: ["a book", "a bag", "a desk"], answer: 0, tip: "It's a book." },
  { id: "m4", icon: "pencil", choices: ["a pen", "a pencil", "a ruler"], answer: 1, tip: "It's a pencil." },
  { id: "m5", icon: "bag", choices: ["a bag", "a book", "a notebook"], answer: 0, tip: "It's a bag." },
  { id: "m6", icon: "notebook", choices: ["a notebook", "a book", "a pencil"], answer: 0, tip: "It's a notebook." },
  { id: "m7", icon: "desk", choices: ["a desk", "a bag", "a book"], answer: 0, tip: "It's a desk." },
  { id: "m8", icon: "rubber", choices: ["a rubber", "a ruler", "a pen"], answer: 0, tip: "It's a rubber." },
  { id: "m9", icon: "pen", choices: ["a pen", "a pencil", "a ruler"], answer: 0, tip: "Look again. This one is a pen, not a pencil.", challenge: true },
  { id: "m10", icon: "pencil", choices: ["a pen", "a pencil", "a rubber"], answer: 1, tip: "Look again. This one is a pencil, not a pen.", challenge: true }
];

const MOLES = [
  { id: "o1", icon: "pen", prompt: "Is it a pen?", choices: ["Yes, it is.", "No, it isn't.", "It's a ruler."], answer: 0, tip: "Look. It's a pen. So we say: Yes, it is." },
  { id: "o2", icon: "pencil", prompt: "Is it a ruler?", choices: ["No, it isn't.", "Yes, it is.", "It's a book."], answer: 0, tip: "Look. It's a pencil. So we say: No, it isn't." },
  { id: "o3", icon: "book", prompt: "Is it a book?", choices: ["Yes, it is.", "No, it isn't.", "It's a pen."], answer: 0, tip: "Look. It's a book. So we say: Yes, it is." },

let state = load();
let play = null;
let timer = 0;
let molePop = 0;
let raidFrame = 0;
let raidHold = null;
let pendingYes = null;

const view = document.getElementById("view");
const feedback = document.getElementById("feedback");
const caption = document.getElementById("caption");

function fresh() {
  return {
    sound: true,
    best: { maze: 0, moles: 0, hangman: 0, planes: 0 },
    done: { maze: false, moles: false, hangman: false, planes: false },
    missed: { maze: [], moles: [], hangman: [], planes: [] }
  };
}

function load() {
  const base = fresh();
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if (!saved) return base;
    return {
      sound: saved.sound !== false,
      best: { ...base.best, ...(saved.best || {}) },
      done: { ...base.done, ...(saved.done || {}) },
      missed: { ...base.missed, ...(saved.missed || {}) }
    };
  } catch (err) {
    return base;
  }
}

function save() {
  localStorage.setItem(KEY, JSON.stringify(state));
}

function esc(value) {
  return String(value).replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}

function icon(name) {
  return `<svg class="ico" viewBox="0 0 80 80" aria-hidden="true">${ICONS[name] || ""}</svg>`;
}

function totalStars() {
  return (state.best.maze || 0) + (state.best.moles || 0) + (state.best.hangman || 0) + (state.best.planes || 0);
}

function unlocked(id) {
  if (id === "maze") return true;
  if (id === "moles") return !!state.done.maze;
  if (id === "hangman") return !!state.done.moles;
  return !!state.done.hangman;
}

function setFeedback(text, kind) {
  feedback.textContent = text || "";
  feedback.className = kind || "";
}

function setCaption(text) {
  caption.textContent = text;
}

function updateChrome() {
  const soundBtn = document.getElementById("soundBtn");
  soundBtn.textContent = state.sound ? "Sound on" : "Sound off";
  soundBtn.setAttribute("aria-pressed", state.sound ? "true" : "false");
  const stars = document.getElementById("stars");
  if (play) {
    stars.textContent = "★ " + play.stars;
    stars.setAttribute("aria-label", play.stars + " stars this game");
  } else {
    const n = totalStars();
    stars.textContent = "★ " + n;
    stars.setAttribute("aria-label", n + " stars in all, out of 40");
  }
}

function pickVoice() {
  const voices = window.speechSynthesis.getVoices();
  return voices.find((v) => /en-GB/i.test(v.lang))
    || voices.find((v) => /^en/i.test(v.lang))
    || null;
}

function speak(text, fromButton) {
  if (!text || (!state.sound && !fromButton)) return;
  if (!("speechSynthesis" in window)) {
    if (fromButton) setFeedback("Read the words on the screen.", "tip");
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "en-GB";
  utter.rate = 0.9;
  utter.pitch = 1.15;
  const voice = pickVoice();
  if (voice) utter.voice = voice;
  window.speechSynthesis.speak(utter);
}

function spoken(item) {
  if (!item) return "";
  if (play.gate === "maze" || play.gate === "hangman" || play.gate === "planes") return "What's this?";
  if (play.gate === "moles") return item.prompt;
  return "";
}

function answerName(item) {
  if (item.word) return item.word;
  return item.choices[item.answer];
}

function pictureName(item) {
  const names = {
    pen: "a pen", pencil: "a pencil", ruler: "a ruler", book: "a book",
    bag: "a bag", notebook: "a notebook", desk: "a desk", rubber: "a rubber"
  };
  return names[item.icon] || "";
}

function missedRecord(item) {
  const label = play.gate === "hangman"
    ? "Spell it."
    : play.gate === "planes"
      ? "Shoot the right word."
      : (play.gate === "moles" ? item.prompt : "What's this?");
  return { id: item.id, label, answer: answerName(item), tip: item.tip };
}

function current() {
  return play.items[play.index];
}

function shuffled(choices, answerIndex) {
  const row = choices.map((text, i) => ({ text, ok: i === answerIndex }));
  for (let i = row.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = row[i];
    row[i] = row[j];
    row[j] = tmp;
  }
  return row;
}

function stopMoles() {
  clearTimeout(molePop);
  molePop = 0;
  stopRaid();
}

function stopRaid() {
  if (raidFrame) cancelAnimationFrame(raidFrame);
  raidFrame = 0;
  if (raidHold) {
    window.removeEventListener("pointermove", raidHold.move);
    window.removeEventListener("pointerup", raidHold.up);
    window.removeEventListener("pointercancel", raidHold.up);
    window.removeEventListener("keydown", raidHold.keyDown);
    window.removeEventListener("keyup", raidHold.keyUp);
    raidHold = null;
  }
}

function moleButtons() {
  return [...view.querySelectorAll(".mole")];
}

function fillMole(mole, pair) {
  mole.textContent = pair.text;
  mole.dataset.ok = pair.ok ? "1" : "0";
  mole.setAttribute("aria-hidden", "false");
  mole.tabIndex = 0;
  mole.classList.add("up");
}

function showRandomMoles() {
  const moles = moleButtons();
  moles.forEach((mole) => {
    mole.classList.remove("up", "wrong", "show-right");
    mole.textContent = "";
    mole.dataset.ok = "0";
    mole.setAttribute("aria-hidden", "true");
    mole.tabIndex = -1;
  });
  const pool = play.molePairs.slice();
  for (let i = pool.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = pool[i];
    pool[i] = pool[j];
    pool[j] = tmp;
  }
  const show = [pool[0], pool[1]];
  if ((play.moleWait || 0) >= 1 && !show.some((pair) => pair.ok)) {
    show[0] = play.molePairs.find((pair) => pair.ok);
  }
  const holes = [0, 1, 2, 3, 4, 5];
  for (let i = holes.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = holes[i];
    holes[i] = holes[j];
    holes[j] = tmp;
  }
  const chosen = [];
  show.forEach((pair, index) => {
    const mole = moles[holes[index]];
    mole.textContent = pair.text;
    mole.dataset.ok = pair.ok ? "1" : "0";
    chosen.push(mole);
  });
  play.moleWait = show.some((pair) => pair.ok) ? 0 : (play.moleWait || 0) + 1;
  requestAnimationFrame(() => {
    chosen.forEach((mole) => {
      if (!play || play.tried || play.locked) return;
      mole.classList.add("up");
      mole.setAttribute("aria-hidden", "false");
      mole.tabIndex = 0;
    });
  });
}

function holdCorrectMole() {
  stopMoles();
  const moles = moleButtons();
  const answer = current().choices[current().answer];
  moles.forEach((mole, index) => {
    mole.classList.remove("up", "wrong", "show-right");
    mole.textContent = "";
    mole.dataset.ok = "0";
    mole.setAttribute("aria-hidden", "true");
    mole.tabIndex = -1;
    if (index === 2) {
      fillMole(mole, { text: answer, ok: true });
      mole.classList.add("show-right");
    }
  });
}

function startMoleLoop() {
  stopMoles();
  const step = play.step;
  play.moleWait = 0;
  if (reduceMotion) {
    const moles = moleButtons();
    play.molePairs.forEach((pair, index) => fillMole(moles[index], pair));
    return;
  }
  function live() {
    return play && play.step === step && !play.locked && !play.tried && !play.finished && !play.left;
  }
  function rise() {
    if (!live()) return;
    showRandomMoles();
    molePop = setTimeout(drop, 1400);
  }
  function drop() {
    if (!live()) return;
    moleButtons().forEach((mole) => mole.classList.remove("up"));
    molePop = setTimeout(rise, 420);
  }
  rise();
}

function later(fn, ms) {
  clearTimeout(timer);
  const step = play.step;
  timer = setTimeout(() => {
    if (!play || play.step !== step || play.left) return;
    fn();
  }, reduceMotion ? 180 : ms);
}

function showHub() {
  clearTimeout(timer);
  stopMoles();
  play = null;
  document.body.dataset.screen = "hub";
  updateChrome();
  setFeedback("");

        <h1>Pen or pencil?</h1>

        <circle cx="48" cy="54" r="3" fill="#14213d"/><circle cx="72" cy="54" r="3" fill="#14213d"/>
        <rect x="46" y="66" width="28" height="6" rx="3" fill="#fff"/>
        <rect x="36" y="84" width="48" height="26" rx="10" fill="#17324d"/>
      </svg>

    <div class="gates">
      ${GATES.map((gate) => gateCard(gate)).join("")}
    </div>
    <p class="partner">Play with a partner. One reads. One answers. <button type="button" class="linkish" data-act="reset">Start over</button></p>
  `;
  const title = view.querySelector("h1");
  if (title) title.focus?.();
}

function gateCard(gate) {
  const open = unlocked(gate.id);
  const best = state.best[gate.id] || 0;
  const missed = (state.missed[gate.id] || []).length;
  let status = open ? "Play" : "Locked";
  if (open && state.done[gate.id]) status = `Play again · best ${best}/10`;
  if (open && missed) status += ` · ${missed} to practise`;
  const act = open ? "play" : "soon";
  return `
    <button type="button" class="gate" data-act="${act}" data-gate="${gate.id}" data-need="${esc(gate.need)}" ${open ? "" : 'aria-disabled="true"'}>
      <span class="scene scene-${gate.id}" aria-hidden="true"></span>
      <span class="num">${gate.n}</span>
      <span class="gt">${esc(gate.title)}</span>
      <span class="gl">${esc(gate.line)}</span>
      <span class="gs">${esc(open ? status : gate.need)}</span>
    </button>
  `;
}

function start(gate, mode) {
  if (!unlocked(gate)) {
    setFeedback(GATES.find((g) => g.id === gate).need, "tip");
    return;
  }
  let items = BANKS[gate].slice();
  if (mode === "retry") {
    const ids = new Set((state.missed[gate] || []).map((row) => row.id));
    items = BANKS[gate].filter((item) => ids.has(item.id));
    if (!items.length) {
      showHub();
      return;
    }
  }
  play = {
    gate, mode, items, index: 0, stars: 0, missed: [],
    tried: false, locked: false, step: 0, left: false, finished: false, moving: false
  };
  renderPlay();
}

function renderPlay() {
  play.locked = false;
  play.guessed = [];
  play.wrong = 0;
  play.tried = false;
  play.moving = false;
  play.resolving = false;
  stopMoles();
  document.body.dataset.screen = play.gate;
  updateChrome();
  const item = current();
  const n = play.items.length;
  const label = play.mode === "retry" ? "Tricky ones" : GAME[play.gate];
  setCaption(CAPTION[play.gate]);
  const hint = play.gate === "hangman"
    ? "Guess a letter."
    : play.gate === "planes"
      ? (reduceMotion ? "Tap the plane with the right word." : "Move the plane. Hold to shoot.")
      : play.gate === "moles"
        ? "Hit the right mole when it pops up."
        : "Read it. Then choose.";
  setFeedback(hint, "tip");
  const pips = play.items.map((_, i) => {
    const cls = i < play.index ? "did" : (i === play.index ? "now" : "");
    return `<i class="${cls}"></i>`;
  }).join("");
  view.innerHTML = `
    <div class="playwrap">
      <div class="playbar">
        <button type="button" class="ghost back" data-act="back">Island</button>
        <p class="gatename">${esc(label)}</p>
        <p class="count">${play.index + 1} / ${n}</p>
      </div>
      <div class="pips" role="progressbar" aria-valuemin="1" aria-valuemax="${n}" aria-valuenow="${play.index + 1}" aria-label="Question ${play.index + 1} of ${n}">${pips}</div>
      <section class="stage${item.challenge ? " challenge" : ""}" aria-label="${item.challenge ? "Challenge. " : ""}Question ${play.index + 1} of ${n}">
        ${stageInner(item)}
        <button type="button" class="next" data-act="next" hidden>Next</button>
      </section>
    </div>
  `;
  const title = document.getElementById("qtitle");
  if (title) title.focus({ preventScroll: true });
  if (play.gate === "moles") startMoleLoop();
  if (play.gate === "planes") startRaid();
  speak(spoken(item), false);
}

function stageInner(item) {
  const chip = item.challenge ? `<span class="chip">Challenge</span> ` : "";
  if (play.gate === "maze") {
    const pairs = shuffled(item.choices, item.answer);
    return `
      <div class="door">
        <span class="star" aria-hidden="true">★</span>
        <div class="pic" role="img" aria-label="${esc(pictureName(item))}">${icon(item.icon)}</div>
      </div>
      <div class="qrow">
        <h2 id="qtitle" tabindex="-1">${chip}What's this?</h2>
        <button type="button" class="ghost" data-act="hear">Hear it</button>
      </div>
      <div class="choices">
        ${pairs.map((pair) => `<button type="button" class="choice" data-act="pick" data-ok="${pair.ok ? "1" : "0"}">${esc(pair.text)}</button>`).join("")}
      </div>
    `;
  }
  if (play.gate === "moles") {
    play.molePairs = shuffled(item.choices, item.answer);
    return `
      <div class="pic small" role="img" aria-label="${esc(pictureName(item))}">${icon(item.icon)}</div>
      <div class="qrow">
        <h2 id="qtitle" tabindex="-1">${chip}${esc(item.prompt)}</h2>
        <button type="button" class="ghost" data-act="hear">Hear it</button>
      </div>
      <p class="draghint">Hit the right answer when it pops up.</p>
      <div class="field">
        ${[0, 1, 2, 3, 4, 5].map(() => `<div class="pit"><button type="button" class="mole" data-act="pick" data-ok="0" tabindex="-1" aria-hidden="true"></button><div class="hole" aria-hidden="true"></div></div>`).join("")}
      </div>
    `;
  }
  if (play.gate === "planes") {
    const pairs = shuffled(item.choices, item.answer);
    const colors = ["#c81e1e", "#157a3a", "#2f6fed"];
    return `
      <div class="pic small" role="img" aria-label="${esc(pictureName(item))}">${icon(item.icon)}</div>
      <div class="qrow">
        <h2 id="qtitle" tabindex="-1">${chip}Shoot the right word.</h2>
        <button type="button" class="ghost" data-act="hear">Hear it</button>
      </div>
      <div class="sky${reduceMotion ? " still" : ""}" id="sky">
        <i class="cloud c1" aria-hidden="true"></i>
        <i class="cloud c2" aria-hidden="true"></i>
        <i class="cloud c3" aria-hidden="true"></i>
        ${pairs.map((pair, index) => `
          <button type="button" class="bandit" data-act="shoot" data-ok="${pair.ok ? "1" : "0"}" data-lane="${index}">
            <span>${esc(pair.text)}</span>
            <svg class="miniplane" viewBox="0 0 80 64" aria-hidden="true">
              <polygon points="10,22 40,30 70,22 40,26" fill="${colors[index]}" stroke="#14213d" stroke-width="3" stroke-linejoin="round"/>
              <polygon points="40,58 48,36 46,14 40,6 34,14 32,36" fill="${colors[index]}" stroke="#14213d" stroke-width="3" stroke-linejoin="round"/>
              <polygon points="24,10 40,16 56,10 40,14" fill="#14213d"/>
              <ellipse cx="40" cy="30" rx="5" ry="7" fill="#fffdf8" stroke="#14213d" stroke-width="2"/>
            </svg>
          </button>
        `).join("")}
        <div id="bolts"></div>
        <svg class="ship" id="ship" viewBox="0 0 80 96" aria-hidden="true">
          <polygon points="18,74 40,62 62,74 40,68" fill="#14213d"/>
          <polygon points="4,46 40,36 76,46 40,42" fill="#ffe14a" stroke="#14213d" stroke-width="3" stroke-linejoin="round"/>
          <polygon points="40,8 50,30 48,82 40,92 32,82 30,30" fill="#ffe14a" stroke="#14213d" stroke-width="3" stroke-linejoin="round"/>
          <ellipse cx="40" cy="42" rx="6" ry="10" fill="#2f6fed" stroke="#14213d" stroke-width="2"/>
        </svg>
      </div>
    `;
  }
  const letters = "abcdefghijklmnopqrstuvwxyz".split("");
  return `
    <div class="hangrow">
      <div class="pic small" role="img" aria-label="${esc(pictureName(item))}">${icon(item.icon)}</div>
      <svg class="gallows" viewBox="0 0 160 190" aria-hidden="true">
        <g fill="none" stroke="#14213d" stroke-width="4" stroke-linecap="round">
          <path d="M16 176 H104"/>
          <path d="M36 176 V16"/>
          <path d="M36 16 H114"/>
          <path d="M114 16 V40" stroke="#c4843c"/>
        </g>
        <g fill="none" stroke="#14213d" stroke-width="4" stroke-linecap="round">
          <g class="part" data-part="1">
            <circle cx="114" cy="56" r="15" fill="#fffdf8"/>
            <circle cx="108" cy="53" r="1.6" fill="#14213d" stroke="none"/>
            <circle cx="120" cy="53" r="1.6" fill="#14213d" stroke="none"/>
            <path d="M108 61 Q114 65 120 61"/>
          </g>
          <g class="part" data-part="2"><path d="M114 72 V112"/></g>
          <g class="part" data-part="3"><path d="M114 84 L94 100"/></g>
          <g class="part" data-part="4"><path d="M114 84 L134 100"/></g>
          <g class="part" data-part="5"><path d="M114 112 L96 142"/></g>
          <g class="part" data-part="6"><path d="M114 112 L132 142"/></g>
        </g>
      </svg>
    </div>
    <div class="qrow">
      <h2 id="qtitle" tabindex="-1">${chip}Spell it.</h2>
      <button type="button" class="ghost" data-act="hear">Hear it</button>
    </div>
    <div class="blanks" aria-label="Word to spell">
      ${item.word.split("").map(() => `<span class="blank"></span>`).join("")}
    </div>
    <p class="tries" id="tries">6 tries left</p>
    <div class="abc">
      ${letters.map((letter) => `<button type="button" class="key" data-act="guess" data-letter="${letter}">${letter}</button>`).join("")}
    </div>
  `;
}

function bindDrag() {
  const card = document.getElementById("card");
  if (!card) return;
  let drag = null;
  function basketUnder(x, y) {
    const stack = document.elementsFromPoint(x, y);
    for (const el of stack) {
      if (el.closest) {
        const basket = el.closest("[data-act='basket']");
        if (basket) return basket;
      }
    }
    return null;
  }
  function end() {
    card.classList.remove("dragging");
    card.style.transform = "";
    card.style.pointerEvents = "";
    view.querySelectorAll(".basket").forEach((basket) => basket.classList.remove("over"));
    drag = null;
  }
  card.addEventListener("pointerdown", (event) => {
    if (event.button !== 0 || !play || play.locked) return;
    drag = { id: event.pointerId, x: event.clientX, y: event.clientY, dx: 0, dy: 0 };
    card.setPointerCapture(event.pointerId);
    card.classList.add("dragging");
  });
  card.addEventListener("pointermove", (event) => {
    if (!drag || event.pointerId !== drag.id) return;
    drag.dx = event.clientX - drag.x;
    drag.dy = event.clientY - drag.y;
    card.style.pointerEvents = "none";
    card.style.transform = `translate(${drag.dx}px, ${drag.dy}px)`;
    const hit = basketUnder(event.clientX, event.clientY);
    view.querySelectorAll(".basket").forEach((basket) => basket.classList.toggle("over", basket === hit));
  });
  card.addEventListener("pointerup", (event) => {
    if (!drag || event.pointerId !== drag.id) return;
    const moved = Math.hypot(drag.dx, drag.dy) > 16;
    const hit = basketUnder(event.clientX, event.clientY);
    end();
    if (moved && hit) grade(hit.dataset.basket === current().basket, hit);
  });
  card.addEventListener("pointercancel", end);
}

function paintBlanks(reveal) {
  const word = current().word;
  view.querySelectorAll(".blank").forEach((blank, index) => {
    const letter = word[index];
    if (reveal || play.guessed.includes(letter)) {
      blank.textContent = letter;
      blank.classList.toggle("show", Boolean(reveal) && !play.guessed.includes(letter));
    }
  });
}

function guessLetter(letter) {
  if (!play || play.locked || play.left || play.finished || play.gate !== "hangman") return;
  if (!letter || play.guessed.includes(letter)) return;
  play.guessed.push(letter);
  const item = current();
  const key = view.querySelector(`[data-letter="${letter}"]`);
  if (item.word.includes(letter)) {
    if (key) {
      key.disabled = true;
      key.classList.add("right");
    }
    paintBlanks(false);
    const solved = item.word.split("").every((char) => play.guessed.includes(char));
    if (!solved) setFeedback("In the word.", "ok");
    if (solved) {
      play.locked = true;
      play.stars += 1;
      updateChrome();
      view.querySelectorAll(".key").forEach((btn) => { btn.disabled = true; });
      setFeedback("Yes! A star.", "ok");
      later(next, 700);
    }
    return;
  }
  if (key) {
    key.disabled = true;
    key.classList.add("wrong");
  }
  play.wrong += 1;
  const part = view.querySelector(`[data-part="${play.wrong}"]`);
  if (part) part.classList.add("on");
  const left = 6 - play.wrong;
  const tries = document.getElementById("tries");
  if (tries) tries.textContent = left === 1 ? "1 try left" : left + " tries left";
  if (play.wrong < 6) {
    setFeedback("Not in the word.", "tip");
    return;
  }
  play.locked = true;
  play.missed.push(missedRecord(item));
  paintBlanks(true);
  if (tries) tries.textContent = "The word is " + item.word + ".";
  view.querySelectorAll(".key").forEach((btn) => { btn.disabled = true; });
  const nextBtn = view.querySelector("[data-act='next']");
  if (nextBtn) nextBtn.hidden = false;
  setFeedback(item.tip, "tip");
}

function grade(ok, el) {
  if (!play || play.locked || play.left || play.finished) return;
  if (play.gate === "moles" && el && !el.classList.contains("up")) return;
  const planes = play.gate === "planes";
  if (!planes) stopMoles();
  const item = current();
  if (ok) {
    const first = !play.tried;
    if (!planes) play.locked = true;
    play.tried = true;
    if (first) play.stars += 1;
    if (el) el.classList.add("right");
    updateChrome();
    setFeedback(first ? "Yes! A star." : "That's right.", "ok");
    later(next, planes ? 420 : 650);
    return;
  }
  if (el) {
    el.classList.add("wrong");
    if (!planes) {
      el.classList.remove("shake");
      void el.offsetWidth;
      el.classList.add("shake");
    }
  }
  if (!play.tried) {
    play.tried = true;
    play.missed.push(missedRecord(item));
    if (play.gate === "moles") holdCorrectMole();
    else if (planes) parkAnswer();
    else markCorrect();
    if (!planes) {
      const nextBtn = view.querySelector("[data-act='next']");
      if (nextBtn) nextBtn.hidden = false;
    }
  }
  setFeedback(item.tip, "tip");
  if (planes) later(next, 700);
}

function parkAnswer() {
  const el = view.querySelector(".bandit[data-ok='1']");
  if (!el) return;
  el.classList.add("show-right");
}

function clampUnit(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

function destroyPlane(foe, ok) {
  foe._down = true;
  foe.classList.add(ok ? "right" : "wrong");
  if (ok) {
    const first = !play.tried;
    play.resolving = true;
    play.tried = true;
    if (first) play.stars += 1;
    updateChrome();
    setFeedback(first ? "Yes! A star." : "That's right.", "ok");
    later(next, 700);
    return;
  }
  if (!play.tried) {
    play.tried = true;
    play.missed.push(missedRecord(current()));
  }
  setFeedback("Not this one. Keep flying.", "tip");
}

function startRaid() {
  if (!play || play.gate !== "planes" || reduceMotion) return;
  const sky = document.getElementById("sky");
  const ship = document.getElementById("ship");
  const bolts = document.getElementById("bolts");
  if (!sky || !ship || !bolts) return;
  const step = play.step;
  const foes = [...sky.querySelectorAll(".bandit")];
  const lanes = [17, 50, 83];
  const drops = [-24, -150, -276].sort(() => Math.random() - 0.5);
  const keys = new Set();
  play.shipX = 0.5;
  play.shipY = 0.78;
  play.aimX = 0.5;
  play.aimY = 0.78;
  play.firing = false;
  play.bullets = [];
  play.shotAt = 0;
  foes.forEach((foe, index) => {
    foe._lane = lanes[index] || 50;
    foe._y = drops[index];
    foe._down = false;
    foe.style.left = foe._lane + "%";
    foe.style.top = foe._y + "px";
  });
  function aim(event) {
    if (!play || play.step !== step || play.left) return;
    const rect = sky.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    play.aimX = clampUnit((event.clientX - rect.left) / rect.width, 0.08, 0.92);
    play.aimY = clampUnit((event.clientY - rect.top) / rect.height, 0.46, 0.9);
  }
  function holdMove(event) {
    if (!raidHold || !raidHold.holding) return;
    aim(event);
  }
  function holdUp() {
    if (raidHold) raidHold.holding = false;
    if (play && play.step === step) play.firing = keys.size > 0;
  }
  function keyDown(event) {
    if (!play || play.step !== step || play.left) return;
    if (!["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(event.key)) return;
    keys.add(event.key);
    play.firing = true;
    event.preventDefault();
  }
  function keyUp(event) {
    keys.delete(event.key);
    if (play && play.step === step && !raidHold.holding) play.firing = keys.size > 0;
  }
  raidHold = { move: holdMove, up: holdUp, holding: false, keyDown, keyUp };
  window.addEventListener("pointermove", holdMove);
  window.addEventListener("pointerup", holdUp);
  window.addEventListener("pointercancel", holdUp);
  window.addEventListener("keydown", keyDown);
  window.addEventListener("keyup", keyUp);
  sky.addEventListener("pointermove", aim);
  sky.addEventListener("pointerdown", (event) => {
    if (event.button !== 0) return;
    raidHold.holding = true;
    play.firing = true;
    aim(event);
  });
  let last = 0;
  function frame(now) {
    if (!play || play.step !== step || play.left || play.finished) return;
    if (!last) last = now;
    const dt = Math.min(34, now - last);
    last = now;
    const rect = sky.getBoundingClientRect();
    if (rect.width < 10 || rect.height < 10) {
      raidFrame = requestAnimationFrame(frame);
      return;
    }
    const nudge = 0.7 * (dt / 1000);
    if (keys.has("ArrowLeft")) play.aimX -= nudge;
    if (keys.has("ArrowRight")) play.aimX += nudge;
    if (keys.has("ArrowUp")) play.aimY -= nudge;
    if (keys.has("ArrowDown")) play.aimY += nudge;
    play.aimX = clampUnit(play.aimX, 0.08, 0.92);
    play.aimY = clampUnit(play.aimY, 0.46, 0.9);
    play.shipX += (play.aimX - play.shipX) * 0.18;
    play.shipY += (play.aimY - play.shipY) * 0.18;
    ship.style.left = (play.shipX * 100) + "%";
    ship.style.top = (play.shipY * 100) + "%";
    const fall = rect.height * 0.2 * (dt / 1000);
    let escaped = false;
    foes.forEach((foe) => {
      foe._y += foe._down ? fall * 2.4 : fall;
      const bob = Math.sin(now / 520 + foe._lane) * 1.2;
      foe.style.left = (foe._lane + bob) + "%";
      foe.style.top = foe._y + "px";
      if (!foe._down && foe.dataset.ok === "1" && foe._y > rect.height - 36) escaped = true;
    });
    const shooting = play.firing && !play.resolving;
    if (shooting && now - play.shotAt > 140) {
      play.shotAt = now;
      const shipRect = ship.getBoundingClientRect();
      play.bullets.push({
        x: shipRect.left - rect.left + shipRect.width / 2,
        y: shipRect.top - rect.top + 8
      });
    }
    const speed = rect.height * 1.45 * (dt / 1000);
    play.bullets.forEach((bolt) => { bolt.y -= speed; });
    play.bullets = play.bullets.filter((bolt) => bolt.y > -24);
    const struck = [];
    if (!play.resolving) {
      play.bullets = play.bullets.filter((bolt) => {
        for (const foe of foes) {
          if (foe._down) continue;
          const body = foe.querySelector(".miniplane") || foe;
          const fr = body.getBoundingClientRect();
          const left = fr.left - rect.left;
          const top = fr.top - rect.top;
          if (top > -20 && bolt.x > left - 8 && bolt.x < left + fr.width + 8 && bolt.y > top && bolt.y < top + fr.height) {
            struck.push(foe);
            return false;
          }
        }
        return true;
      });
    }
    while (bolts.children.length < play.bullets.length) {
      const mark = document.createElement("i");
      mark.className = "bolt";
      bolts.appendChild(mark);
    }
    [...bolts.children].forEach((mark, index) => {
      const bolt = play.bullets[index];
      mark.hidden = !bolt;
      if (!bolt) return;
      mark.style.left = bolt.x + "px";
      mark.style.top = bolt.y + "px";
    });
    struck.forEach((foe) => {
      if (foe._down || play.resolving) return;
      destroyPlane(foe, foe.dataset.ok === "1");
    });
    if (!play.resolving && escaped) {
      play.resolving = true;
      if (!play.tried) {
        play.tried = true;
        play.missed.push(missedRecord(current()));
      }
      parkAnswer();
      setFeedback(current().tip, "tip");
      later(next, 700);
    }
    raidFrame = requestAnimationFrame(frame);
  }
  raidFrame = requestAnimationFrame(frame);
}

function markCorrect() {
  const el = view.querySelector("[data-ok='1']");
  if (el) el.classList.add("show-right");
}

function next() {
  if (!play || play.left || play.finished || play.moving) return;
  play.moving = true;
  clearTimeout(timer);
  stopMoles();
  play.step += 1;
  play.index += 1;
  if (play.index >= play.items.length) finish();
  else renderPlay();
}

function finish() {
  if (!play || play.finished) return;
  play.finished = true;
  clearTimeout(timer);
  stopMoles();
  const firstClear = play.mode === "full" && !state.done[play.gate];
  if (play.mode === "full") {
    state.best[play.gate] = Math.max(state.best[play.gate] || 0, play.stars);
    state.done[play.gate] = true;
  }
  state.missed[play.gate] = play.missed;
  save();
  renderResults();
  const perfect = play.stars === play.items.length;
  if (!reduceMotion && (perfect || firstClear)) burst();
}

function renderResults() {
  document.body.dataset.screen = "results";
  updateChrome();
  setCaption(CAPTION.results);
  setFeedback("");
  const total = play.items.length;
  const perfect = play.stars === total;
  const best = state.best[play.gate] || 0;
  const pct = Math.round((best / 10) * 100);
  const title = play.mode === "retry" ? "Practice done." : "Game complete!";
  let scoreLine = play.gate === "hangman"
    ? `You spelled ${play.stars} / ${total} words.`
    : play.gate === "planes"
      ? `You hit ${play.stars} / ${total} planes.`
      : `You got ${play.stars} / ${total} stars on the first try.`;
  if (play.mode === "retry") scoreLine = `You got ${play.stars} / ${total} this time.`;
  let badgeLine = `${BADGE[play.gate]} collected. This gate ${pct}/100. Best ${best}/10.`;
  if (play.mode === "retry") badgeLine = `Your ${GAME[play.gate]} score stays ${pct}/100.`;
  const tips = play.missed.map((row) => `
    <li>
      <p><b>${esc(row.label)}</b> → ${esc(row.answer)}</p>
      <p>${esc(row.tip)}</p>
    </li>
  `).join("");
  const retryBtn = play.missed.length
    ? `<button type="button" class="btn leaf" data-act="retry">Wrong ones only</button>`
    : "";
  view.innerHTML = `
    <div class="playwrap results">
      <p class="pill">${esc(GAME[play.gate])}</p>
      <h2 tabindex="-1">${title}</h2>
      <p>${esc(scoreLine)}</p>
      <p>${esc(badgeLine)}</p>
      ${perfect && play.mode === "full" ? "<p>Every one was right on the first try.</p>" : ""}
      ${play.missed.length ? `<h3>Read the tip. Try again.</h3><ul class="tips">${tips}</ul>` : ""}
      <div class="actions">
        ${retryBtn}
        <button type="button" class="btn gold" data-act="again">Play this gate again</button>
        <button type="button" class="btn" data-act="hub">Back to the island</button>
      </div>
    </div>
  `;
  const heading = view.querySelector("h2");
  if (heading) heading.focus();
}

function leave() {
  if (!play || play.finished) {
    showHub();
    return;
  }
  const mid = play.index > 0 || play.tried;
  if (!mid) {
    play.left = true;
    clearTimeout(timer);
    stopMoles();
    showHub();
    return;
  }
  ask("Leave this game? Stars from this try will not be saved.", "Leave", () => {
    if (play) play.left = true;
    clearTimeout(timer);
    stopMoles();
    showHub();
  });
}

function ask(text, yesLabel, onYes) {
  pendingYes = onYes;
  document.getElementById("asktext").textContent = text;
  document.getElementById("askyes").textContent = yesLabel;
  document.getElementById("ask").hidden = false;
  document.getElementById("askno").focus();
}

function closeAsk() {
  pendingYes = null;
  document.getElementById("ask").hidden = true;
}

function burst() {
  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(window.innerWidth * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const colors = ["#ffe14a", "#2f6fed", "#157a3a", "#c81e1e", "#f2a7b8"];
  const bits = Array.from({ length: 64 }, () => ({
    x: window.innerWidth / 2 + (Math.random() - 0.5) * 180,
    y: window.innerHeight * 0.32,
    vx: (Math.random() - 0.5) * 8,
    vy: Math.random() * -8 - 2,
    g: 0.16 + Math.random() * 0.1,
    w: 6 + Math.random() * 6,
    h: 8 + Math.random() * 5,
    color: colors[Math.floor(Math.random() * colors.length)],
    rot: Math.random() * 6
  }));
  let frame = 0;
  function tick() {
    frame += 1;
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    bits.forEach((bit) => {
      bit.vy += bit.g;
      bit.x += bit.vx;
      bit.y += bit.vy;
      bit.rot += 0.12;
      ctx.save();
      ctx.translate(bit.x, bit.y);
      ctx.rotate(bit.rot);
      ctx.fillStyle = bit.color;
      ctx.fillRect(-bit.w / 2, -bit.h / 2, bit.w, bit.h);
      ctx.restore();
    });
    if (frame < 70) requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  }
  tick();
}

document.body.addEventListener("click", (event) => {
  const el = event.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "sound") {
    state.sound = !state.sound;
    save();
    updateChrome();
    if (state.sound && play && !play.finished) speak(spoken(current()), false);
    return;
  }
  if (act === "ask-no") { closeAsk(); return; }
  if (act === "ask-yes") {
    const yes = pendingYes;
    closeAsk();
    if (yes) yes();
    return;
  }
  if (!document.getElementById("ask").hidden) return;
  if (act === "play") start(el.dataset.gate, "full");
  else if (act === "soon") {
    setFeedback(el.dataset.need, "tip");
    setCaption(el.dataset.need);
  }
  else if (act === "back" || act === "hub") leave();
  else if (act === "pick") {
    if (play && play.gate === "moles" && !el.classList.contains("up")) return;
    grade(el.dataset.ok === "1", el);
  }
  else if (act === "guess") guessLetter(el.dataset.letter);
  else if (act === "shoot") {
    if (!reduceMotion && event.detail !== 0) return;
    grade(el.dataset.ok === "1", el);
  }
  else if (act === "next") next();
  else if (act === "hear") speak(spoken(current()), true);
  else if (act === "retry") start(play.gate, "retry");
  else if (act === "again") start(play.gate, "full");
  else if (act === "reset") {
    ask("Start over? Stars and badges will clear.", "Start over", () => {
      state = fresh();
      save();
      showHub();
    });
  }
});

document.addEventListener("keydown", (event) => {
  const asking = !document.getElementById("ask").hidden;
  if (asking) {
    if (event.key === "Escape") closeAsk();
    return;
  }
  if (!play || play.finished || play.left) return;
  if (event.key === "Escape") {
    leave();
    return;
  }
  if (play.locked) return;
  if (event.target && event.target.closest && event.target.closest("button") && event.key === "Enter") return;
  if (play.gate === "planes") {
    if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
      event.preventDefault();
      if (!play.locked) {
        play.armed = true;
        play.shipX = (play.shipX || 0.5) + (event.key === "ArrowLeft" ? -0.07 : 0.07);
      }
    } else if (reduceMotion && (event.key === "1" || event.key === "2" || event.key === "3")) {
      const button = [...view.querySelectorAll(".bandit")][Number(event.key) - 1];
      if (button) button.click();
    }
    return;
  }
  if (play.gate === "hangman") {
    if (/^[a-z]$/i.test(event.key)) guessLetter(event.key.toLowerCase());
    return;
  }
  if (play.gate === "moles") {
    if (event.key === "1" || event.key === "2" || event.key === "3") {
      const buttons = [...view.querySelectorAll(".mole.up")];
      const button = buttons[Number(event.key) - 1];
      if (button) button.click();
    }
    return;
  }
  if (event.key === "1" || event.key === "2" || event.key === "3") {
    const buttons = [...view.querySelectorAll("[data-act='pick']")];
    const button = buttons[Number(event.key) - 1];
    if (button) button.click();
  }
});

if ("speechSynthesis" in window) {
  window.speechSynthesis.onvoiceschanged = () => {};
}

showHub();
</script>
</body>
</html>
