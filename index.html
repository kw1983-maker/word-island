<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f3eee4">
<title>Word Island · Unit 1</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23ffe14a%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14213d;
    --paper: #f3eee4;
    --card: #fffdf8;
    --navy: #14213d;
    --gold: #ffe14a;
    --gold-deep: #c9a414;
    --leaf: #157a3a;
    --leaf-soft: #d9f3e4;
    --sky: #2f6fed;
    --coral: #9c2f24;
    --coral-soft: #ffd9d4;
    --line: #e4d8c4;
    --focus: #14213d;
    --shadow: 0 10px 0 rgba(20, 33, 61, .06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: Lexend, "Trebuchet MS", sans-serif;
    color: var(--ink);
    background-color: var(--paper);
    background-image:
      radial-gradient(circle at 8% 12%, #d9f3e4 0, transparent 32%),
      radial-gradient(circle at 96% 0%, #ffe9a8 0, transparent 26%),
      radial-gradient(circle at 80% 100%, #d5e6ff 0, transparent 28%);
  }
  body[data-screen="maze"] { background-color: #e7f6ef; }
  body[data-screen="moles"] { background-color: #e5f4ee; }
  body[data-screen="hangman"] { background-color: #f8f1e4; }
  body[data-screen="planes"] { background-color: #d7eefe; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 3px;
  }
  .skip {
    position: absolute;
    left: 12px;
    top: -40px;
    background: #fff;
    padding: 8px 12px;
    z-index: 5;
  }
  .skip:focus { top: 12px; }
  .app { min-height: 100dvh; display: flex; flex-direction: column; }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 18px 6px;
    width: min(1040px, 100%);
    margin: 0 auto;
  }
  .brand { margin: 0; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--gold);
    box-shadow: inset 0 -2px 0 var(--gold-deep);
  }
  .tools { display: flex; align-items: center; gap: 8px; }
  #who { margin: 0; font-weight: 600; max-width: 22ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #stars { margin: 0; font-weight: 700; min-width: 3ch; }
  .ghost, .btn, .choice, .mole, .gate, .next {
    border: 3px solid var(--ink);
    border-radius: 14px;
    background: #fff;
    box-shadow: 0 4px 0 rgba(20, 33, 61, .18);
  }
  .ghost { padding: 6px 12px; font-weight: 700; background: transparent; }
  .ghost[aria-pressed="true"] { background: var(--gold); }
  main { flex: 0 0 auto; width: min(1040px, 100%); margin: 0 auto; padding: 8px 18px 12px; }
  #caption { margin-top: auto; }
  .hero { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; margin-bottom: 18px; }
  .pill {
    display: inline-block;
    margin: 0 0 8px;
    background: var(--gold);
    border-radius: 999px;
    padding: 4px 12px;
    font-weight: 700;
    font-size: .92rem;
  }
  h1 {
    font-family: Fraunces, Palatino, Georgia, serif;
    font-size: clamp(2.4rem, 6vw, 4.4rem);
    line-height: .95;
    font-weight: 600;
    margin: 0 0 8px;
    letter-spacing: -0.03em;
  }
  .lede { margin: 0; font-size: 1.15rem; max-width: 40ch; }
  .ladder { margin: 10px 0 0; font-weight: 700; color: var(--leaf); }
  .robo { width: 120px; height: 120px; }
  .gates { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .gate {
    text-align: left;
    padding: 14px;
    background: var(--card);
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 230px;
  }
  .gate:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(20, 33, 61, .18); }
  .gate[aria-disabled="true"] { opacity: .72; }
  .num { font-weight: 700; color: var(--sky); }
  .gt { font-family: Fraunces, Palatino, Georgia, serif; font-size: 1.7rem; font-weight: 600; }
  .gl, .gs { display: block; }
  .gs { margin-top: auto; font-weight: 700; }
  .scene { height: 64px; border-radius: 12px; border: 2px solid var(--ink); }
  .scene-maze {
    background:
      radial-gradient(circle at 72% 42%, #ffe14a 0 9px, transparent 10px),
      linear-gradient(#b7e4c7, #7dcea0);
  }
  .scene-moles {
    background:
      radial-gradient(circle at 20% 70%, #6b3f2a 0 10px, transparent 11px),
      radial-gradient(circle at 50% 62%, #f3d2b5 0 12px, transparent 13px),
      radial-gradient(circle at 78% 70%, #6b3f2a 0 10px, transparent 11px),
      linear-gradient(#c8f0d4, #8fd4b0);
  }
  .scene-hangman {
    background:
      radial-gradient(ellipse 9px 12px at 22% 42%, #d62828 98%, transparent),
      radial-gradient(ellipse 9px 12px at 40% 36%, #ffd60a 98%, transparent),
      radial-gradient(ellipse 9px 12px at 58% 42%, #2a9d3a 98%, transparent),
      radial-gradient(ellipse 9px 12px at 76% 36%, #1d6fe0 98%, transparent),
      linear-gradient(#fff6ea, #f3d7b0);
  }
  .scene-planes {
    background:
      linear-gradient(#ffe14a, #ffe14a) 50% 62% / 18px 8px no-repeat,
      linear-gradient(#14213d, #14213d) 42% 70% / 10px 16px no-repeat,
      linear-gradient(#14213d, #14213d) 58% 70% / 10px 16px no-repeat,
      radial-gradient(circle at 22% 28%, #fff 0 7px, transparent 8px),
      linear-gradient(#7ec8f8, #d4efff);
  }
  .partner { margin: 14px 0 0; }
  .linkish { background: none; border: 0; box-shadow: none; padding: 0; font-weight: 700; text-decoration: underline; }
  .playwrap { width: min(760px, 100%); margin: 0 auto; }
  .playbar { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .playbar .back { padding: 6px 12px; font-weight: 700; }
  .gatename { margin: 0; font-weight: 700; flex: 1; }
  .count { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pips { display: flex; gap: 5px; margin: 0 0 12px; }
  .pips i {
    flex: 1; height: 8px; border-radius: 99px; background: #fff; border: 2px solid var(--ink);
    display: block;
  }
  .pips i.did { background: var(--leaf); }
  .pips i.now { background: var(--gold); }
  .stage {
    background: var(--card);
    border: 3px solid var(--ink);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 16px;
  }
  .stage.challenge { box-shadow: inset 0 0 0 4px var(--gold), var(--shadow); }
  .qrow { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .qrow .ghost { flex: none; white-space: nowrap; }
  #qtitle {
    font-family: Fraunces, Palatino, Georgia, serif;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    line-height: 1.15;
    margin: 0;
    font-weight: 600;
  }
  #qtitle:focus { outline: none; }
  .chip {
    display: inline-block;
    margin-bottom: 6px;
    background: var(--gold);
    border-radius: 999px;
    padding: 2px 8px;
    font-family: Lexend, sans-serif;
    font-size: .85rem;
    font-weight: 700;
    vertical-align: middle;
  }
  .door {
    width: min(300px, 90%);
    margin: 8px auto 12px;
    background: linear-gradient(#fff6d8, #ffe9a8);
    border: 3px solid var(--ink);
    border-radius: 18px 18px 8px 8px;
    padding: 28px 10px 16px;
    position: relative;
  }
  .door .star {
    position: absolute;
    top: -14px; left: 50%;
    transform: translateX(-50%);
    background: var(--gold);
    border: 3px solid var(--ink);
    border-radius: 50%;
    width: 36px; height: 36px;
    display: grid; place-items: center;
    font-weight: 700;
  }
  .pic { display: grid; place-items: center; min-height: 150px; }
  .pic.small { min-height: 96px; }
  .ico { width: 128px; height: 128px; }
  .pic.small .ico { width: 88px; height: 88px; }
  .photo { display: block; max-width: 100%; max-height: 170px; border-radius: 12px; }
  .pic.small .photo { max-height: 120px; }
  .tally { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; max-width: 280px; }
  .tally .ico { width: 44px; height: 44px; }
  .pic.small .tally .ico { width: 40px; height: 40px; }
  .balloon { width: 96px; height: 128px; }
  .pic.small .balloon { width: 70px; height: 94px; }
  .mix { display: flex; align-items: center; gap: 8px; font-size: 2rem; font-weight: 700; }
  .blob { width: 64px; height: 64px; border-radius: 50% 46% 52% 44%; border: 3px solid var(--ink); display: inline-block; }
  .mix .q, .tile.q { background: #fff; border: 3px dashed var(--ink); }
  .mix .q { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; }
  .letters { display: flex; gap: 8px; }
  .tile {
    width: 56px; height: 64px; display: grid; place-items: center;
    border: 3px solid var(--ink); border-radius: 12px; background: #fff;
    font-family: Fraunces, Palatino, Georgia, serif; font-size: 2.2rem; font-weight: 700;
  }
  .numbadge {
    width: 110px; height: 110px; border-radius: 50%; display: grid; place-items: center;
    background: var(--gold); border: 4px solid var(--ink);
    font-family: Fraunces, Palatino, Georgia, serif; font-size: 3.6rem; font-weight: 700;
  }
  .pic.small .numbadge { width: 84px; height: 84px; font-size: 2.8rem; }
  .quote {
    position: relative; background: #fff; border: 3px solid var(--ink); border-radius: 22px;
    padding: 14px 22px; font-family: Fraunces, Palatino, Georgia, serif; font-size: clamp(1.4rem, 3.4vw, 2rem); font-weight: 600;
  }
  .pic .quote { margin-bottom: 18px; }
  .quote::after {
    content: ""; position: absolute; left: 28px; bottom: -14px; width: 20px; height: 20px;
    background: #fff; border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink);
    transform: rotate(45deg) skew(10deg, 10deg);
  }
  .ear { width: 110px; height: 110px; }
  .choices { display: grid; gap: 10px; margin-top: 12px; }
  .choice, .mole, .next, .btn {
    font-weight: 700;
    padding: 12px 14px;
  }
  .choice:active, .next:active, .btn:active, .ghost:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 rgba(20, 33, 61, .18);
  }
  .choice.right, .mole.right { background: var(--leaf-soft); border-color: var(--leaf); }
  .choice.wrong, .mole.wrong { background: var(--coral-soft); }
  .choice.show-right, .mole.show-right { background: var(--leaf-soft); }
  .field {
    margin-top: 12px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    background: #c8efd6;
    border-radius: 18px;
    padding: 12px;
    border: 3px solid #1f6b3a;
  }
  .pit { position: relative; height: 140px; overflow: hidden; }
  .hole {
    position: absolute;
    left: 8px; right: 8px; bottom: 8px;
    height: 28px; border-radius: 50%;
    background: #5a3a28;
    border: 3px solid #3a2418;
    z-index: 2;
    pointer-events: none;
  }
  .mole {
    position: absolute;
    left: 6px; right: 6px; bottom: 18px;
    z-index: 1;
    min-height: 84px;
    padding: 8px 6px 14px;
    font-size: .95rem;
    line-height: 1.2;
    border-radius: 18px 18px 12px 12px;
    background: #f6d7c3;
    transform: translateY(140%);
    transition: transform .22s ease;
    pointer-events: none;
  }
  .mole.up { transform: translateY(0); pointer-events: auto; }
  .mole.up:active { transform: translateY(5px); }
  .draghint { text-align: center; margin: 0 0 8px; font-size: .95rem; }
  .hangrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
  .balloons { display: flex; gap: 4px; justify-content: center; }
  .balloons svg { width: 30px; height: 44px; transition: transform .25s ease, opacity .25s ease; }
  .balloons svg.popped { opacity: .14; transform: scale(.55) translateY(20px); }
  .blanks { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 12px 0; }
  .blank {
    width: 42px; height: 50px;
    border-bottom: 4px solid var(--ink);
    display: grid; place-items: center;
    font-family: Fraunces, Palatino, Georgia, serif;
    font-size: 2rem; font-weight: 600;
  }
  .blank.gap { border-bottom: 0; width: 18px; }
  .blank.show { color: var(--coral); }
  .tries { text-align: center; margin: 0 0 8px; font-weight: 700; }
  .sky {
    position: relative;
    height: min(460px, 62dvh);
    min-height: 320px;
    margin-top: 8px;
    overflow: hidden;
    border-radius: 16px;
    border: 3px solid var(--ink);
    background: linear-gradient(#67b7ee, #e7f6ff 72%, #8fd4b0);
    touch-action: none;
    user-select: none;
  }
  .cloud {
    position: absolute;
    height: 22px;
    border-radius: 20px;
    background: #fff;
    opacity: .85;
    animation: drift 8s linear infinite;
    pointer-events: none;
  }
  .cloud.c1 { width: 74px; left: 12%; top: -30px; animation-duration: 9s; }
  .cloud.c2 { width: 52px; left: 62%; top: -80px; animation-duration: 7.5s; animation-delay: -3s; }
  .cloud.c3 { width: 90px; left: 38%; top: -140px; animation-duration: 11s; animation-delay: -6s; }
  @keyframes drift {
    from { transform: translateY(0); }
    to { transform: translateY(560px); }
  }
  .bandit {
    position: absolute;
    top: 12px;
    width: 30%;
    transform: translateX(-50%);
    border: 0;
    background: transparent;
    box-shadow: none;
    padding: 0;
    pointer-events: none;
    z-index: 1;
  }
  .bandit[data-lane="0"] { left: 17%; }
  .bandit[data-lane="1"] { left: 50%; }
  .bandit[data-lane="2"] { left: 83%; }
  .bandit span {
    display: block;
    background: #fffdf8;
    border: 3px solid var(--ink);
    border-radius: 10px;
    padding: 4px 4px 3px;
    font-weight: 700;
    font-size: clamp(.78rem, 2.5vw, 1rem);
    line-height: 1.15;
    text-align: center;
  }
  .bandit span.big { font-size: clamp(1.3rem, 4vw, 1.8rem); }
  .bandit span .ico { width: 46px; height: 46px; display: block; margin: 0 auto; }
  .miniplane { width: 54px; height: 42px; display: block; margin: 2px auto 0; }
  .bandit.right span, .bandit.show-right span { background: var(--leaf-soft); }
  .bandit.wrong span { background: var(--coral-soft); }
  .ship {
    position: absolute;
    left: 50%;
    top: 78%;
    width: 58px;
    height: 68px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 3;
    filter: drop-shadow(0 6px 0 rgba(20, 33, 61, .18));
  }
  .bolt {
    position: absolute;
    width: 6px;
    height: 16px;
    margin-left: -3px;
    border-radius: 4px;
    background: var(--gold);
    border: 2px solid var(--ink);
    pointer-events: none;
    z-index: 2;
  }
  .sky.still .ship, .sky.still .cloud, .sky.still #bolts { display: none; }
  .sky.still .bandit { pointer-events: auto; cursor: pointer; }
  .abc { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .key {
    min-height: 42px;
    font-weight: 700;
    font-size: 1.05rem;
    border: 3px solid var(--ink);
    border-radius: 10px;
    background: #fff;
    box-shadow: 0 3px 0 rgba(20, 33, 61, .18);
  }
  .key:disabled { box-shadow: none; }
  .key.right:disabled { background: var(--leaf-soft); }
  .key.wrong:disabled { background: var(--coral-soft); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .btn.gold { background: var(--gold); }
  .btn.leaf { background: var(--leaf-soft); }
  .results h2 {
    font-family: Fraunces, Palatino, Georgia, serif;
    font-size: clamp(2rem, 5vw, 3.2rem);
    margin: 0 0 8px;
    font-weight: 600;
  }
  .report {
    background: var(--card); border: 3px solid var(--ink); border-radius: 18px; padding: 12px 14px; margin: 12px 0;
  }
  .report p { margin: 0 0 6px; }
  .bests { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 12px; }
  .sendnote { font-weight: 700; margin-top: 8px !important; }
  .sendnote.ok { color: var(--leaf); }
  .tips { list-style: none; padding: 0; margin: 12px 0; display: grid; gap: 8px; }
  .tips li { background: #fff8e4; border-radius: 12px; padding: 10px 12px; }
  .tips p { margin: 0; }
  .namebox {
    width: min(520px, 100%); margin: 20px auto; background: var(--card); border: 3px solid var(--ink);
    border-radius: 24px; padding: 20px; box-shadow: var(--shadow); display: grid; gap: 14px;
  }
  .namebox h1 { font-size: clamp(2rem, 6vw, 3rem); }
  .namebox label { display: grid; gap: 6px; font-weight: 700; }
  .namebox input {
    border: 3px solid var(--ink); border-radius: 12px; padding: 10px 12px; font-size: 1.2rem; background: #fff;
  }
  .teach { width: min(1040px, 100%); margin: 0 auto; }
  .teach h1 { font-size: clamp(2rem, 5vw, 3rem); }
  .tfilter { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
  .links { background: #fff8e4; border-radius: 14px; padding: 10px 14px; margin: 10px 0; }
  .links p { margin: 0 0 4px; }
  .links code { font-size: .9rem; word-break: break-all; }
  .tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .tcard {
    background: var(--card); border: 3px solid var(--ink); border-radius: 18px; padding: 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .tcard[hidden] { display: none; }
  .tcard h3 { margin: 0; font-family: Fraunces, Palatino, Georgia, serif; font-size: 1.4rem; }
  .tcard ul { margin: 0; padding-left: 20px; }
  .tcard li.ans { font-weight: 400; }
  .tcard.shown li.ans { font-weight: 700; color: var(--leaf); }
  .tcard .say { display: none; margin: 0; font-weight: 700; color: var(--leaf); }
  .tcard.shown .say { display: block; }
  .tcard .row { display: flex; gap: 6px; margin-top: auto; }
  .tcard .meta { margin: 0; font-size: .85rem; font-weight: 700; color: var(--sky); }
  #feedback {
    min-height: 2.8em;
    margin: 0 auto;
    width: min(1040px, 100%);
    padding: 4px 18px 8px;
    text-align: center;
    font-weight: 700;
  }
  #feedback:empty { min-height: 0; padding: 0; }
  #feedback.ok { color: var(--leaf); }
  #feedback.tip { color: var(--ink); }
  h2:focus { outline: none; }
  #caption {
    margin: 0;
    background: var(--navy);
    color: #f4efe4;
    text-align: center;
    padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
    font-weight: 600;
    line-height: 1.35;
  }
  .ask {
    position: fixed; inset: 0;
    background: rgba(20, 33, 61, .45);
    display: grid; place-items: center;
    z-index: 10;
    padding: 18px;
  }
  .ask[hidden] { display: none; }
  .askbox {
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 18px;
    padding: 18px;
    width: min(420px, 100%);
    box-shadow: var(--shadow);
  }
  .askbox p { margin: 0 0 12px; font-weight: 700; }
  .askbox div { display: flex; gap: 8px; justify-content: flex-end; }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15; }
  .shake { animation: shake .4s linear; }
  .mole.shake { animation: mole-shake .4s linear; }
  @keyframes mole-shake {
    25% { margin-left: -6px; }
    75% { margin-left: 6px; }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  @media (max-width: 800px) {
    .hero { grid-template-columns: 1fr; }
    .robo { display: none; }
    .gates { grid-template-columns: 1fr; }
    .gate { min-height: 0; }
    .field { grid-template-columns: repeat(2, 1fr); }
    .hangrow { grid-template-columns: 1fr; }
    .abc { grid-template-columns: repeat(6, 1fr); }
    #who { display: none; }
  }
  @media (min-width: 700px) {
    .choices { grid-template-columns: repeat(3, 1fr); }
  }
  @media (hover: hover) {
    .choice:hover, .gate:hover, .btn:hover {
      transform: translateY(-2px);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>

function load() {
  const base = fresh();
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if (!saved) return base;
    return {
      sound: saved.sound !== false,
      name: typeof saved.name === "string" ? saved.name : "",
      cls: typeof saved.cls === "string" ? saved.cls : "",
      best: { ...base.best, ...(saved.best || {}) },
      done: { ...base.done, ...(saved.done || {}) },
      missed: { ...base.missed, ...(saved.missed || {}) }
    };
  } catch (err) {
    return base;
  }
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch (err) {
    // Private windows can block storage. The game still works for this visit.
  }
}

function esc(value) {
  return String(value).replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}

function icon(name) {
  return `<svg class="ico" viewBox="0 0 80 80" aria-hidden="true">${ICONS[name] || ""}</svg>`;
}

function balloonSvg(colour, cls) {
  const fill = HEX[colour] || colour;
  return `<svg class="${cls || "balloon"}" viewBox="0 0 60 88" aria-hidden="true">
    <path d="M30 60 q-4 10 2 26" fill="none" stroke="#14213d" stroke-width="2"/>
    <ellipse cx="30" cy="30" rx="24" ry="28" fill="${fill}" stroke="#14213d" stroke-width="3"/>
    <polygon points="26,58 34,58 30,64" fill="${fill}" stroke="#14213d" stroke-width="2"/>
    <ellipse cx="21" cy="19" rx="5" ry="8" fill="#fff" opacity=".45"/>
  </svg>`;
}

const EAR = '<svg class="ear" viewBox="0 0 80 80" aria-hidden="true"><rect x="12" y="28" width="16" height="24" rx="3" fill="#14213d"/><polygon points="28,28 46,14 46,66 28,52" fill="#14213d"/><path d="M54 30 q8 10 0 20 M60 22 q16 18 0 36" fill="none" stroke="#2f6fed" stroke-width="5" stroke-linecap="round"/></svg>';

function picture(item, small) {
  const pic = item.pic;
  let inner = "";
  let alt = item.alt || "";
  if (!pic) {
    inner = EAR;
    alt = "Listen";
  } else if (pic.img) {
    inner = `<img class="photo" src="img/${pic.img}.webp" alt="">`;
  } else if (pic.i) {
    inner = icon(pic.i);
  } else if (pic.balloon) {
    inner = balloonSvg(pic.balloon);
  } else if (pic.count) {
    inner = `<span class="tally">${Array.from({ length: pic.count }, () => icon("pencil")).join("")}</span>`;
  } else if (pic.mix) {
    inner = `<span class="mix"><span class="blob" style="background:${HEX[pic.mix[0]]}"></span>+<span class="blob" style="background:${HEX[pic.mix[1]]}"></span>=<span class="q">?</span></span>`;
  } else if (pic.abc) {
    inner = `<span class="letters">${pic.abc.split(" ").map((l) => `<span class="tile">${l}</span>`).join("")}<span class="tile q">?</span></span>`;
  } else if (pic.num != null) {
    inner = `<span class="numbadge">${pic.num}</span>`;
  } else if (pic.quote) {
    inner = `<span class="quote">“${esc(pic.quote)}”</span>`;
  }
  return `<div class="pic${small ? " small" : ""}" role="img" aria-label="${esc(alt)}">${inner}</div>`;
}

function shuffle(list) {
  const row = list.slice();
  for (let i = row.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = row[i];
    row[i] = row[j];
    row[j] = tmp;
  }
  return row;
}

// Ten questions: eight spread across the topics, then two challenge ones.
function pickRound(bank) {
  const byTopic = {};
  shuffle(bank.filter((item) => !item.challenge)).forEach((item) => {
    (byTopic[item.topic] = byTopic[item.topic] || []).push(item);
  });
  const topics = shuffle(Object.keys(byTopic));
  const easy = [];
  let k = 0;
  while (easy.length < ROUND - 2 && topics.some((t) => byTopic[t].length)) {
    const t = topics[k % topics.length];
    k += 1;
    if (byTopic[t].length) easy.push(byTopic[t].shift());
  }
  const hard = shuffle(bank.filter((item) => item.challenge)).slice(0, ROUND - easy.length);
  const out = shuffle(easy).concat(hard);
  const spare = shuffle(Object.values(byTopic).flat());
  while (out.length < ROUND && spare.length) out.push(spare.shift());
  return out;
}

function totalStars() {
  return GAME_IDS.reduce((sum, id) => sum + (state.best[id] || 0), 0);
}

function unlocked(id) {
  if (openAll || id === "maze" || id === forcedGame) return true;
  if (id === "moles") return !!state.done.maze;
  if (id === "hangman") return !!state.done.moles;
  return !!state.done.hangman;
}

function setFeedback(text, kind) {
  feedback.textContent = text || "";
  feedback.className = kind || "";
}

function setCaption(text) {
  caption.textContent = text;
}

function updateChrome() {
  const soundBtn = document.getElementById("soundBtn");
  soundBtn.textContent = state.sound ? "Sound on" : "Sound off";
  soundBtn.setAttribute("aria-pressed", state.sound ? "true" : "false");
  document.getElementById("who").textContent = state.name ? state.name + (state.cls ? " · " + state.cls : "") : "";
  const stars = document.getElementById("stars");
  if (play) {
    stars.textContent = "★ " + play.stars;
    stars.setAttribute("aria-label", play.stars + " stars this game");
  } else {
    const n = totalStars();
    stars.textContent = "★ " + n;
    stars.setAttribute("aria-label", n + " stars in all, out of 40");
  }
}

function pickVoice() {
  const voices = window.speechSynthesis.getVoices();
  return voices.find((v) => /en-GB/i.test(v.lang))
    || voices.find((v) => /^en/i.test(v.lang))
    || null;
}

function canSpeak() {
  return "speechSynthesis" in window;
}

function speak(text, fromButton) {
  if (!text || (!state.sound && !fromButton)) return;
  if (!canSpeak()) {
    if (fromButton) setFeedback("Read the words on the screen.", "tip");
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "en-GB";
  utter.rate = 0.9;
  utter.pitch = 1.15;
  const voice = pickVoice();
  if (voice) utter.voice = voice;
  window.speechSynthesis.speak(utter);
}

function gameOf(item) {
  return GAME_IDS.find((id) => BANKS[id].includes(item));
}

function spoken(item) {
  if (!item) return "";
  const game = gameOf(item);
  if (game === "planes") return item.say;
  if (game === "hangman") return item.word;
  return item.speakQ || item.q;
}

// In "Listen and shoot", pupils without sound read the word instead.
function listenText(item) {
  return item.show || item.say;
}

function choiceText(item, choice) {
  return item.icons ? THING[choice] : choice;
}

function answerText(item) {
  if (item.word) return item.word;
  return choiceText(item, item.choices[0]);
}

function questionText(item) {
  const game = gameOf(item);
  if (game === "planes") return "Listen: " + listenText(item);
  if (game === "hangman") return "Spell it: " + item.word;
  if (item.pic && item.pic.quote) return `“${item.pic.quote}” ${item.q}`;
  return item.q;
}

function tipFor(item) {
  if (item.word) return `${item.word}. ${item.word.replace(/ /g, "").split("").join(", ")}.`;
  return item.say;
}

function missedRecord(item) {
  return { id: item.id, label: questionText(item), answer: answerText(item), tip: tipFor(item) };
}

function current() {
  return play.items[play.index];
}

function choicePairs(item) {
  return shuffle(item.choices.map((text, i) => ({ text, ok: i === 0 })));
}

function stopMoles() {
  clearTimeout(molePop);
  molePop = 0;
  stopRaid();
}

function stopRaid() {
  if (raidFrame) cancelAnimationFrame(raidFrame);
  raidFrame = 0;
  if (raidHold) {
    window.removeEventListener("pointermove", raidHold.move);
    window.removeEventListener("pointerup", raidHold.up);
    window.removeEventListener("pointercancel", raidHold.up);
    window.removeEventListener("keydown", raidHold.keyDown);
    window.removeEventListener("keyup", raidHold.keyUp);
    raidHold = null;
  }
}

function moleButtons() {
  return [...view.querySelectorAll(".mole")];
}

function fillMole(mole, pair) {
  mole.textContent = pair.text;
  mole.dataset.ok = pair.ok ? "1" : "0";
  mole.setAttribute("aria-hidden", "false");
  mole.tabIndex = 0;
  mole.classList.add("up");
}

function showRandomMoles() {
  const moles = moleButtons();
  moles.forEach((mole) => {
    mole.classList.remove("up", "wrong", "show-right");
    mole.textContent = "";
    mole.dataset.ok = "0";
    mole.setAttribute("aria-hidden", "true");
    mole.tabIndex = -1;
  });
  const pool = shuffle(play.molePairs);
  const show = [pool[0], pool[1]];
  if ((play.moleWait || 0) >= 1 && !show.some((pair) => pair.ok)) {
    show[0] = play.molePairs.find((pair) => pair.ok);
  }
  const holes = shuffle([0, 1, 2, 3, 4, 5]);
  const chosen = [];
  show.forEach((pair, index) => {
    const mole = moles[holes[index]];
    mole.textContent = pair.text;
    mole.dataset.ok = pair.ok ? "1" : "0";
    chosen.push(mole);
  });
  play.moleWait = show.some((pair) => pair.ok) ? 0 : (play.moleWait || 0) + 1;
  requestAnimationFrame(() => {
    chosen.forEach((mole) => {
      if (!play || play.tried || play.locked) return;
      mole.classList.add("up");
      mole.setAttribute("aria-hidden", "false");
      mole.tabIndex = 0;
    });
  });
}

function holdCorrectMole() {
  stopMoles();
  const moles = moleButtons();
  const answer = current().choices[0];
  moles.forEach((mole, index) => {
    mole.classList.remove("up", "wrong", "show-right");
    mole.textContent = "";
    mole.dataset.ok = "0";
    mole.setAttribute("aria-hidden", "true");
    mole.tabIndex = -1;
    if (index === 2) {
      fillMole(mole, { text: answer, ok: true });
      mole.classList.add("show-right");
    }
  });
}

function startMoleLoop() {
  stopMoles();
  const step = play.step;
  play.moleWait = 0;
  if (reduceMotion) {
    const moles = moleButtons();
    play.molePairs.forEach((pair, index) => fillMole(moles[index], pair));
    return;
  }
  function live() {
    return play && play.step === step && !play.locked && !play.tried && !play.finished && !play.left;
  }
  function rise() {
    if (!live()) return;
    showRandomMoles();
    molePop = setTimeout(drop, 2200);
  }
  function drop() {
    if (!live()) return;
    moleButtons().forEach((mole) => mole.classList.remove("up"));
    molePop = setTimeout(rise, 450);
  }
  rise();
}

function later(fn, ms) {
  clearTimeout(timer);
  const step = play.step;
  timer = setTimeout(() => {
    if (!play || play.step !== step || play.left) return;
    fn();
  }, ms);
}

function showName() {

function enter() {

function showHub() {

function gateCard(gate) {
  const open = unlocked(gate.id);
  const best = state.best[gate.id] || 0;
  const missed = (state.missed[gate.id] || []).length;
  let status = open ? "Play" : "Locked";
  if (open && state.done[gate.id]) status = `Play again · best ${best}/10`;
  if (open && missed) status += ` · ${missed} to practise`;
  const act = open ? "play" : "soon";
  return `
    <button type="button" class="gate" data-act="${act}" data-gate="${gate.id}" data-need="${esc(gate.need)}" ${open ? "" : 'aria-disabled="true"'}>
      <span class="scene scene-${gate.id}" aria-hidden="true"></span>
      <span class="num">${gate.n}</span>
      <span class="gt">${esc(gate.title)}</span>
      <span class="gl">${esc(gate.line)}</span>
      <span class="gs">${esc(open ? status : gate.need)}</span>
    </button>
  `;
}

function start(gate, mode) {
  if (!unlocked(gate)) {
    setFeedback(GATES.find((g) => g.id === gate).need, "tip");
    return;
  }
  let items = pickRound(BANKS[gate]);
  if (mode === "retry") {
    const ids = new Set((state.missed[gate] || []).map((row) => row.id));
    items = BANKS[gate].filter((item) => ids.has(item.id));
    if (!items.length) {
      showHub();
      return;
    }
  }
  play = {
    gate, mode, items, index: 0, stars: 0, missed: [], log: [],
    tried: false, locked: false, step: 0, left: false, finished: false, moving: false
  };
  renderPlay();
}

function renderPlay() {
  play.locked = false;
  play.guessed = [];
  play.wrong = 0;
  play.tried = false;
  play.moving = false;
  play.resolving = false;
  stopMoles();
  document.body.dataset.screen = play.gate;
  updateChrome();
  const item = current();
  const n = play.items.length;
  const label = play.mode === "retry" ? "Tricky ones" : GAME[play.gate];
  setCaption(CAPTION[play.gate]);
  const hint = play.gate === "hangman"
    ? "Guess a letter."
    : play.gate === "planes"
      ? (reduceMotion ? "Tap the plane with the right answer." : "Move the plane. Hold to shoot.")
      : play.gate === "moles"
        ? "Hit the right mole when it pops up."
        : "Read it. Then choose.";
  setFeedback(hint, "tip");
  const pips = play.items.map((_, i) => {
    const cls = i < play.index ? "did" : (i === play.index ? "now" : "");
    return `<i class="${cls}"></i>`;
  }).join("");
  view.innerHTML = `
    <div class="playwrap">
      <div class="playbar">
        <button type="button" class="ghost back" data-act="back">Island</button>
        <p class="gatename">${esc(label)}</p>
        <p class="count">${play.index + 1} / ${n}</p>
      </div>
      <div class="pips" role="progressbar" aria-valuemin="1" aria-valuemax="${n}" aria-valuenow="${play.index + 1}" aria-label="Question ${play.index + 1} of ${n}">${pips}</div>
      <section class="stage${item.challenge ? " challenge" : ""}" aria-label="${item.challenge ? "Challenge. " : ""}Question ${play.index + 1} of ${n}">
        ${stageInner(item)}
        <button type="button" class="next" data-act="next" hidden>Next</button>
      </section>
    </div>
  `;
  const title = document.getElementById("qtitle");
  if (title) title.focus({ preventScroll: true });
  if (play.gate === "moles") startMoleLoop();
  if (play.gate === "planes") startRaid();
  speak(spoken(item), false);
}

function stageInner(item) {
  const chip = item.challenge ? `<span class="chip">Challenge</span> ` : "";
  if (play.gate === "maze") {
    return `
      <div class="door">
        <span class="star" aria-hidden="true">★</span>
        ${picture(item)}
      </div>
      <div class="qrow">
        <h2 id="qtitle" tabindex="-1">${chip}${esc(item.q)}</h2>
        <button type="button" class="ghost" data-act="hear">Hear it</button>
      </div>
      <div class="choices">

      </div>
    `;
  }

      ${picture(item, true)}

        <i class="cloud c1" aria-hidden="true"></i>
        <i class="cloud c2" aria-hidden="true"></i>

        ${pairs.map((pair, index) => `
          <button type="button" class="bandit" data-act="shoot" data-ok="${pair.ok ? "1" : "0"}" data-lane="${index}" aria-label="${esc(choiceText(item, pair.text))}">
            <span class="${item.big ? "big" : ""}">${item.icons ? icon(pair.text) : esc(pair.text)}</span>
            <svg class="miniplane" viewBox="0 0 80 64" aria-hidden="true">
              <polygon points="10,22 40,30 70,22 40,26" fill="${colors[index]}" stroke="#14213d" stroke-width="3" stroke-linejoin="round"/>
              <polygon points="40,58 48,36 46,14 40,6 34,14 32,36" fill="${colors[index]}" stroke="#14213d" stroke-width="3" stroke-linejoin="round"/>
              <polygon points="24,10 40,16 56,10 40,14" fill="#14213d"/>

            </svg>
          </button>
        `).join("")}
        <div id="bolts"></div>
        <svg class="ship" id="ship" viewBox="0 0 80 96" aria-hidden="true">
          <polygon points="18,74 40,62 62,74 40,68" fill="#14213d"/>
          <polygon points="4,46 40,36 76,46 40,42" fill="#ffe14a" stroke="#14213d" stroke-width="3" stroke-linejoin="round"/>
          <polygon points="40,8 50,30 48,82 40,92 32,82 30,30" fill="#ffe14a" stroke="#14213d" stroke-width="3" stroke-linejoin="round"/>
          <ellipse cx="40" cy="42" rx="6" ry="10" fill="#2f6fed" stroke="#14213d" stroke-width="2"/>
        </svg>

    `;
  }
  const letters = "abcdefghijklmnopqrstuvwxyz".split("");
  const tries = ["#d62828", "#ffd60a", "#2a9d3a", "#1d6fe0", "#7b2cbf", "#f77f00"];
  return `
    <div class="hangrow">
      ${picture(item, true)}

        ${tries.map((c, i) => balloonSvg(c, `try t${i + 1}`)).join("")}
      </div>
    </div>
    <div class="qrow">
      <h2 id="qtitle" tabindex="-1">${chip}Spell it.</h2>
      <button type="button" class="ghost" data-act="hear">Hear it</button>
    </div>
    <div class="blanks" aria-label="Word to spell">
      ${item.word.split("").map((ch) => ch === " " ? `<span class="blank gap"></span>` : `<span class="blank"></span>`).join("")}
    </div>
    <p class="tries" id="tries">6 balloons left</p>
    <div class="abc">
      ${letters.map((letter) => `<button type="button" class="key" data-act="guess" data-letter="${letter}">${letter}</button>`).join("")}
    </div>
  `;
}

function paintBlanks(reveal) {
  const word = current().word;
  view.querySelectorAll(".blank").forEach((blank, index) => {
    const letter = word[index];
    if (letter === " ") return;
    const low = letter.toLowerCase();
    if (reveal || play.guessed.includes(low)) {
      blank.textContent = letter;
      blank.classList.toggle("show", Boolean(reveal) && !play.guessed.includes(low));
    }
  });
}

function guessLetter(letter) {
  if (!play || play.locked || play.left || play.finished || play.gate !== "hangman") return;
  if (!letter || play.guessed.includes(letter)) return;
  play.guessed.push(letter);
  const item = current();
  const word = item.word.toLowerCase().replace(/ /g, "");
  const key = view.querySelector(`[data-letter="${letter}"]`);
  if (word.includes(letter)) {
    if (key) {
      key.disabled = true;
      key.classList.add("right");
    }
    paintBlanks(false);
    const solved = word.split("").every((char) => play.guessed.includes(char));
    if (!solved) setFeedback("In the word.", "ok");
    if (solved) {
      play.locked = true;
      play.stars += 1;
      updateChrome();
      view.querySelectorAll(".key").forEach((btn) => { btn.disabled = true; });
      setFeedback("Yes! A star.", "ok");
      speak(item.word, false);
      later(next, 1300);
    }
    return;
  }
  if (key) {
    key.disabled = true;
    key.classList.add("wrong");
  }
  play.wrong += 1;
  const popped = view.querySelector(`.try.t${play.wrong}`);
  if (popped) popped.classList.add("popped");
  const left = 6 - play.wrong;
  const tries = document.getElementById("tries");
  if (tries) tries.textContent = left === 1 ? "1 balloon left" : left + " balloons left";
  if (play.wrong < 6) {
    setFeedback("Not in the word.", "tip");
    return;
  }
  play.locked = true;
  play.missed.push(missedRecord(item));
  paintBlanks(true);
  if (tries) tries.textContent = "The word is " + item.word + ".";
  view.querySelectorAll(".key").forEach((btn) => { btn.disabled = true; });
  const nextBtn = view.querySelector("[data-act='next']");
  if (nextBtn) nextBtn.hidden = false;
  setFeedback(tipFor(item), "tip");
  speak(item.word, false);
}

function grade(ok, el) {
  if (!play || play.locked || play.left || play.finished) return;
  if (play.gate === "moles" && el && !el.classList.contains("up")) return;
  const planes = play.gate === "planes";
  if (!planes) stopMoles();
  const item = current();
  if (ok) {
    const first = !play.tried;
    if (!planes) play.locked = true;
    play.tried = true;
    if (first) play.stars += 1;
    if (el) el.classList.add("right");
    updateChrome();
    setFeedback(first ? "Yes! A star." : "That's right.", "ok");
    speak(item.say, false);
    later(next, 1500);
    return;
  }
  if (el) {
    el.classList.add("wrong");
    if (!planes) {
      el.classList.remove("shake");
      void el.offsetWidth;
      el.classList.add("shake");
    }
  }
  if (!play.tried) {
    play.tried = true;
    play.missed.push(missedRecord(item));
    if (play.gate === "moles") holdCorrectMole();
    else if (planes) parkAnswer();
    else markCorrect();
    if (!planes) {
      const nextBtn = view.querySelector("[data-act='next']");
      if (nextBtn) nextBtn.hidden = false;
    }
  }
  setFeedback(tipFor(item), "tip");
  speak(item.say, false);
  if (planes) later(next, 1800);
}

function parkAnswer() {
  const el = view.querySelector(".bandit[data-ok='1']");
  if (!el) return;
  el.classList.add("show-right");
}

function clampUnit(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

function destroyPlane(foe, ok) {
  foe._down = true;
  foe.classList.add(ok ? "right" : "wrong");
  if (ok) {
    const first = !play.tried;
    play.resolving = true;
    play.tried = true;
    if (first) play.stars += 1;
    updateChrome();
    setFeedback(first ? "Yes! A star." : "That's right.", "ok");
    speak(current().say, false);
    later(next, 1500);
    return;
  }
  if (!play.tried) {
    play.tried = true;
    play.missed.push(missedRecord(current()));
  }
  setFeedback("Not this one. Keep flying.", "tip");
}

function startRaid() {
  if (!play || play.gate !== "planes" || reduceMotion) return;
  const sky = document.getElementById("sky");
  const ship = document.getElementById("ship");
  const bolts = document.getElementById("bolts");
  if (!sky || !ship || !bolts) return;
  const step = play.step;
  const foes = [...sky.querySelectorAll(".bandit")];
  const lanes = [17, 50, 83];
  const drops = shuffle([-24, -150, -276]);
  const keys = new Set();
  play.shipX = 0.5;
  play.shipY = 0.78;
  play.aimX = 0.5;
  play.aimY = 0.78;
  play.firing = false;
  play.bullets = [];
  play.shotAt = 0;
  foes.forEach((foe, index) => {
    foe._lane = lanes[index] || 50;
    foe._y = drops[index];
    foe._down = false;
    foe.style.left = foe._lane + "%";
    foe.style.top = foe._y + "px";
  });
  function aim(event) {
    if (!play || play.step !== step || play.left) return;
    const rect = sky.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    play.aimX = clampUnit((event.clientX - rect.left) / rect.width, 0.08, 0.92);
    play.aimY = clampUnit((event.clientY - rect.top) / rect.height, 0.46, 0.9);
  }
  function holdMove(event) {
    if (!raidHold || !raidHold.holding) return;
    aim(event);
  }
  function holdUp() {
    if (raidHold) raidHold.holding = false;
    if (play && play.step === step) play.firing = keys.size > 0;
  }
  function keyDown(event) {
    if (!play || play.step !== step || play.left) return;
    if (!["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(event.key)) return;
    keys.add(event.key);
    play.firing = true;
    event.preventDefault();
  }
  function keyUp(event) {
    keys.delete(event.key);
    if (play && play.step === step && !raidHold.holding) play.firing = keys.size > 0;
  }
  raidHold = { move: holdMove, up: holdUp, holding: false, keyDown, keyUp };
  window.addEventListener("pointermove", holdMove);
  window.addEventListener("pointerup", holdUp);
  window.addEventListener("pointercancel", holdUp);
  window.addEventListener("keydown", keyDown);
  window.addEventListener("keyup", keyUp);
  sky.addEventListener("pointermove", aim);
  sky.addEventListener("pointerdown", (event) => {
    if (event.button !== 0) return;
    raidHold.holding = true;
    play.firing = true;
    aim(event);
  });
  let last = 0;
  function frame(now) {
    if (!play || play.step !== step || play.left || play.finished) return;
    if (!last) last = now;
    const dt = Math.min(34, now - last);
    last = now;
    const rect = sky.getBoundingClientRect();
    if (rect.width < 10 || rect.height < 10) {
      raidFrame = requestAnimationFrame(frame);
      return;
    }
    const nudge = 0.7 * (dt / 1000);
    if (keys.has("ArrowLeft")) play.aimX -= nudge;
    if (keys.has("ArrowRight")) play.aimX += nudge;
    if (keys.has("ArrowUp")) play.aimY -= nudge;
    if (keys.has("ArrowDown")) play.aimY += nudge;
    play.aimX = clampUnit(play.aimX, 0.08, 0.92);
    play.aimY = clampUnit(play.aimY, 0.46, 0.9);
    play.shipX += (play.aimX - play.shipX) * 0.18;
    play.shipY += (play.aimY - play.shipY) * 0.18;
    ship.style.left = (play.shipX * 100) + "%";
    ship.style.top = (play.shipY * 100) + "%";
    const fall = rect.height * 0.2 * (dt / 1000);
    let escaped = false;
    foes.forEach((foe) => {
      foe._y += foe._down ? fall * 2.4 : fall;
      const bob = Math.sin(now / 520 + foe._lane) * 1.2;
      foe.style.left = (foe._lane + bob) + "%";
      foe.style.top = foe._y + "px";
      if (!foe._down && foe.dataset.ok === "1" && foe._y > rect.height - 36) escaped = true;
    });
    const shooting = play.firing && !play.resolving;
    if (shooting && now - play.shotAt > 140) {
      play.shotAt = now;
      const shipRect = ship.getBoundingClientRect();
      play.bullets.push({
        x: shipRect.left - rect.left + shipRect.width / 2,
        y: shipRect.top - rect.top + 8
      });
    }
    const speed = rect.height * 1.45 * (dt / 1000);
    play.bullets.forEach((bolt) => { bolt.y -= speed; });
    play.bullets = play.bullets.filter((bolt) => bolt.y > -24);
    const struck = [];
    if (!play.resolving) {
      play.bullets = play.bullets.filter((bolt) => {
        for (const foe of foes) {
          if (foe._down) continue;
          const body = foe.querySelector(".miniplane") || foe;
          const fr = body.getBoundingClientRect();
          const left = fr.left - rect.left;
          const top = fr.top - rect.top;
          if (top > -20 && bolt.x > left - 8 && bolt.x < left + fr.width + 8 && bolt.y > top && bolt.y < top + fr.height) {
            struck.push(foe);
            return false;
          }
        }
        return true;
      });
    }
    while (bolts.children.length < play.bullets.length) {
      const mark = document.createElement("i");
      mark.className = "bolt";
      bolts.appendChild(mark);
    }
    [...bolts.children].forEach((mark, index) => {
      const bolt = play.bullets[index];
      mark.hidden = !bolt;
      if (!bolt) return;
      mark.style.left = bolt.x + "px";
      mark.style.top = bolt.y + "px";
    });
    struck.forEach((foe) => {
      if (foe._down || play.resolving) return;
      destroyPlane(foe, foe.dataset.ok === "1");
    });
    if (!play.resolving && escaped) {
      play.resolving = true;
      if (!play.tried) {
        play.tried = true;
        play.missed.push(missedRecord(current()));
      }
      parkAnswer();
      setFeedback(tipFor(current()), "tip");
      speak(current().say, false);
      later(next, 1800);
    }
    raidFrame = requestAnimationFrame(frame);
  }
  raidFrame = requestAnimationFrame(frame);
}

function markCorrect() {
  const el = view.querySelector("[data-ok='1']");
  if (el) el.classList.add("show-right");
}

function next() {
  if (!play || play.left || play.finished || play.moving) return;
  play.moving = true;
  clearTimeout(timer);
  stopMoles();
  const item = current();
  play.log.push({
    id: item.id,
    topic: item.topic,
    q: questionText(item).slice(0, 80),
    a: answerText(item).slice(0, 60),
    ok: !play.missed.some((row) => row.id === item.id)
  });
  play.step += 1;
  play.index += 1;
  if (play.index >= play.items.length) finish();
  else renderPlay();
}

function finish() {
  if (!play || play.finished) return;
  play.finished = true;
  clearTimeout(timer);
  stopMoles();
  const firstClear = play.mode === "full" && !state.done[play.gate];
  if (play.mode === "full") {
    state.best[play.gate] = Math.max(state.best[play.gate] || 0, play.stars);
    state.done[play.gate] = true;
  }
  state.missed[play.gate] = play.missed;
  save();
  renderResults();
  const perfect = play.stars === play.items.length;
  if (!reduceMotion && (perfect || firstClear)) burst();
  setSendNote("Sending your stars to your teacher…", "");
  sendRun({
    name: state.name,
    cls: state.cls,
    game: play.gate,
    mode: play.mode,
    stars: play.stars,
    total: play.items.length,
    answers: play.log
  }).then(showSendResult);
}

function renderResults() {
  document.body.dataset.screen = "results";
  updateChrome();
  setCaption(CAPTION.results);
  setFeedback("");
  const total = play.items.length;
  const perfect = play.stars === total;
  const title = play.mode === "retry" ? "Practice done." : "Game complete!";
  let scoreLine = play.gate === "hangman"
    ? `You spelled ${play.stars} / ${total} words.`
    : play.gate === "planes"
      ? `You hit ${play.stars} / ${total} planes.`
      : `You got ${play.stars} / ${total} stars on the first try.`;
  if (play.mode === "retry") scoreLine = `You got ${play.stars} / ${total} this time.`;
  const badgeLine = play.mode === "retry" ? "" : `<p>${esc(BADGE[play.gate])} collected.</p>`;
  const tips = play.missed.map((row) => `
    <li>
      <p><b>${esc(row.label)}</b> → ${esc(row.answer)}</p>
      <p>${esc(row.tip)}</p>
    </li>
  `).join("");
  const retryBtn = play.missed.length
    ? `<button type="button" class="btn leaf" data-act="retry">Wrong ones only</button>`
    : "";
  const bests = GATES.map((gate) => `<li>${esc(gate.title)}: ★ ${state.best[gate.id] || 0}/10</li>`).join("");
  view.innerHTML = `
    <div class="playwrap results">
      <p class="pill">${esc(GAME[play.gate])}</p>
      <h2 tabindex="-1">${title}</h2>
      <p>${esc(scoreLine)}</p>
      ${badgeLine}
      ${perfect && play.mode === "full" ? "<p>Every one was right on the first try.</p>" : ""}
      <div class="report">
        <p><b>${esc(state.name)}</b>${state.cls ? ` · ${esc(state.cls)}` : ""} · ★ ${totalStars()} / 40</p>
        <ul class="bests">${bests}</ul>
        <p class="sendnote" id="sendnote" role="status"></p>
      </div>
      ${play.missed.length ? `<h3>Read the tip. Try again.</h3><ul class="tips">${tips}</ul>` : ""}
      <div class="actions">
        ${retryBtn}
        <button type="button" class="btn gold" data-act="again">Play again with new questions</button>
        <button type="button" class="btn" data-act="hub">Back to the island</button>
      </div>
    </div>
  `;
  const heading = view.querySelector("h2");
  if (heading) heading.focus();
}

function setSendNote(text, kind) {
  const note = document.getElementById("sendnote");
  if (!note) return;
  note.textContent = text;
  note.className = "sendnote" + (kind ? " " + kind : "");
}

function showSendResult(ok) {
  if (ok) setSendNote("Sent to your teacher ✓", "ok");
  else setSendNote("Not sent yet. It will send next time you open Word Island.", "");
}

// Results go to the teacher through Firebase. Runs wait in an outbox until they are sent.
function readOutbox() {
  try {
    const rows = JSON.parse(localStorage.getItem(OUTBOX) || "[]");
    return Array.isArray(rows) ? rows : [];
  } catch (err) {
    return [];
  }
}

function writeOutbox(rows) {
  try {
    localStorage.setItem(OUTBOX, JSON.stringify(rows));
  } catch (err) {
    // Storage is blocked. The run is still tried once from memory.
  }
}

let memoryOutbox = [];
let flushing = null;

function sendRun(run) {
  memoryOutbox.push(run);
  writeOutbox(readOutbox().concat([run]));
  return flushOutbox();
}

function flushOutbox() {
  if (flushing) return flushing;
  if (typeof window.wiSend !== "function") return Promise.resolve(false);
  flushing = (async () => {
    let rows = readOutbox();
    if (!rows.length) rows = memoryOutbox.slice();
    while (rows.length) {
      try {
        await Promise.race([
          window.wiSend(rows[0]),
          new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), 15000))
        ]);
      } catch (err) {
        console.warn("Word Island: result not sent yet.", err);
        return false;
      }
      rows = rows.slice(1);
      memoryOutbox = memoryOutbox.slice(1);
      writeOutbox(rows);
    }
    return true;
  })().finally(() => { flushing = null; });
  return flushing;
}

window.addEventListener("wi-send-ready", () => {
  if (!readOutbox().length && !memoryOutbox.length) return;
  flushOutbox().then((ok) => {
    if (document.body.dataset.screen === "results") showSendResult(ok);
  });
});

function leave() {
  if (!play || play.finished) {
    showHub();
    return;
  }
  const mid = play.index > 0 || play.tried;
  if (!mid) {
    play.left = true;
    clearTimeout(timer);
    stopMoles();
    showHub();
    return;
  }
  ask2("Leave this game? Stars from this try will not be saved.", "Leave", () => {
    if (play) play.left = true;
    clearTimeout(timer);
    stopMoles();
    showHub();
  });
}

function ask2(text, yesLabel, onYes) {
  pendingYes = onYes;
  document.getElementById("asktext").textContent = text;
  document.getElementById("askyes").textContent = yesLabel;

  document.getElementById("askno").focus();
}

function closeAsk() {

  document.getElementById("ask").hidden = true;

function findItem(id) {
  for (const game of GAME_IDS) {

    if (item) return item;
  }
  return null;
}

function burst() {
  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(window.innerWidth * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const colors = ["#ffe14a", "#2f6fed", "#157a3a", "#c81e1e", "#f2a7b8"];
  const bits = Array.from({ length: 64 }, () => ({
    x: window.innerWidth / 2 + (Math.random() - 0.5) * 180,
    y: window.innerHeight * 0.32,
    vx: (Math.random() - 0.5) * 8,
    vy: Math.random() * -8 - 2,
    g: 0.16 + Math.random() * 0.1,
    w: 6 + Math.random() * 6,
    h: 8 + Math.random() * 5,
    color: colors[Math.floor(Math.random() * colors.length)],
    rot: Math.random() * 6
  }));
  let frame = 0;
  function tick() {
    frame += 1;
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    bits.forEach((bit) => {
      bit.vy += bit.g;
      bit.x += bit.vx;
      bit.y += bit.vy;
      bit.rot += 0.12;
      ctx.save();
      ctx.translate(bit.x, bit.y);
      ctx.rotate(bit.rot);
      ctx.fillStyle = bit.color;
      ctx.fillRect(-bit.w / 2, -bit.h / 2, bit.w, bit.h);
      ctx.restore();
    });
    if (frame < 70) requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  }
  tick();
}

document.body.addEventListener("submit", (event) => {
  if (event.target.dataset.form !== "name") return;
  event.preventDefault();
  const name = document.getElementById("pname").value.trim().slice(0, 39);
  const cls = document.getElementById("pclass").value.trim().slice(0, 19);
  if (!name) {
    setFeedback("Write your name first.", "tip");
    return;
  }
  state.name = name;
  state.cls = cls;
  save();
  enter();
});

document.body.addEventListener("click", (event) => {
  const el = event.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "sound") {
    state.sound = !state.sound;
    save();
    updateChrome();
    if (state.sound && play && !play.finished) speak(spoken(current()), false);
    return;
  }
  if (act === "ask-no") { closeAsk(); return; }
  if (act === "ask-yes") {
    const yes = pendingYes;
    closeAsk();
    if (yes) yes();
    return;
  }
  if (!document.getElementById("ask").hidden) return;
  if (act === "play") start(el.dataset.gate, "full");
  else if (act === "soon") {
    setFeedback(el.dataset.need, "tip");
    setCaption(el.dataset.need);
  }
  else if (act === "back" || act === "hub") leave();
  else if (act === "pick") {
    if (play && play.gate === "moles" && !el.classList.contains("up")) return;
    grade(el.dataset.ok === "1", el);
  }
  else if (act === "guess") guessLetter(el.dataset.letter);
  else if (act === "shoot") {
    if (!reduceMotion && event.detail !== 0) return;
    grade(el.dataset.ok === "1", el);
  }
  else if (act === "next") next();
  else if (act === "hear") speak(spoken(current()), true);
  else if (act === "retry") start(play.gate, "retry");
  else if (act === "again") start(play.gate, "full");
  else if (act === "rename") {
    ask2("Change the name? This device's stars will clear for the new pupil.", "Change", () => {
      state = { ...fresh(), sound: state.sound };
      save();
      showName();
    });
  }
  else if (act === "reset") {
    ask2("Start over? Stars and badges will clear.", "Start over", () => {
      state = { ...fresh(), sound: state.sound, name: state.name, cls: state.cls };
      save();
      showHub();
    });
  }
  else if (act === "t-topic") {
    view.querySelectorAll("[data-act='t-topic']").forEach((btn) => btn.setAttribute("aria-pressed", btn === el ? "true" : "false"));
    const topic = el.dataset.topic;
    view.querySelectorAll(".tcard").forEach((card) => { card.hidden = Boolean(topic) && card.dataset.topic !== topic; });
  }
  else if (act === "t-show") {
    const card = el.closest(".tcard");
    const shown = card.classList.toggle("shown");
    el.textContent = shown ? "Hide answer" : "Show answer";
    if (shown) speak(findItem(el.dataset.id).say, true);
  }
  else if (act === "t-hear") {
    speak(spoken(findItem(el.dataset.id)), true);
  }
});

document.addEventListener("keydown", (event) => {
  const asking = !document.getElementById("ask").hidden;
  if (asking) {
    if (event.key === "Escape") closeAsk();
    return;
  }
  if (!play || play.finished || play.left) return;
  if (event.key === "Escape") {
    leave();
    return;
  }
  if (play.locked) return;
  if (event.target && event.target.closest && event.target.closest("button") && event.key === "Enter") return;
  if (play.gate === "planes") {
    if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
      event.preventDefault();
    } else if (reduceMotion && (event.key === "1" || event.key === "2" || event.key === "3")) {
      const button = [...view.querySelectorAll(".bandit")][Number(event.key) - 1];
      if (button) button.click();
    }
    return;
  }
  if (play.gate === "hangman") {
    if (/^[a-z]$/i.test(event.key)) guessLetter(event.key.toLowerCase());
    return;
  }
  if (play.gate === "moles") {
    if (event.key === "1" || event.key === "2" || event.key === "3") {
      const buttons = [...view.querySelectorAll(".mole.up")];
      const button = buttons[Number(event.key) - 1];
      if (button) button.click();
    }
    return;
  }
  if (event.key === "1" || event.key === "2" || event.key === "3") {
    const buttons = [...view.querySelectorAll("[data-act='pick']")];
    const button = buttons[Number(event.key) - 1];
    if (button) button.click();
  }
});

if (canSpeak()) {
  window.speechSynthesis.onvoiceschanged = () => {};
}

if (teacherMode) showTeacher();
else if (!state.name) showName();
else enter();
</script>
